<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报 · 周报 · 月报</title>
<style>
  :root {
    --bg: #f8f9fb;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #5a5f72;
    --text-muted: #8e92a5;
    --border: #e8eaf0;
    --accent: #6366f1;
    --accent-light: #eef0ff;
    --hero-bg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.18);
    --radius: 12px;
    --radius-sm: 8px;
  }

  [data-theme="dark"] {
    --bg: #0f1117;
    --card-bg: #1a1d27;
    --text: #e6e8ef;
    --text-secondary: #a8adbf;
    --text-muted: #6b7080;
    --border: #2a2e3a;
    --accent: #818cf8;
    --accent-light: #2a2e4a;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* ===== Hero ===== */
  .hero {
    background: var(--hero-bg);
    color: #fff;
    padding: 44px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    top: -120px; right: -100px;
  }
  .hero::after {
    content: '';
    position: absolute;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    bottom: -80px; left: -60px;
  }
  .hero-content { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }
  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 4px 16px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }
  .hero h1 { font-size: 32px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }

  .hero .date-range {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 18px;
    opacity: 0.95;
    line-height: 1.3;
  }
  .hero .date-range.loading-text { font-size: 18px; opacity: 0.9; }

  .theme-toggle {
    position: absolute;
    top: 16px; right: 16px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.15s;
    z-index: 2;
  }
  .theme-toggle:hover { background: rgba(255,255,255,0.3); transform: scale(1.08); }

  .weather {
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 16px;
    padding: 16px 20px;
    margin: 0 auto 22px;
    max-width: 680px;
    text-align: left;
  }
  .weather-loading { font-size: 14px; opacity: 0.85; text-align: center; padding: 8px; }
  .weather-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .weather-city {
    font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .weather-city select {
    background: rgba(255,255,255,0.22);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
  }
  .weather-city select option { color: #1a1a2e; background: #fff; }
  .weather-update { font-size: 11px; opacity: 0.65; }
  .weather-now { display: flex; align-items: center; gap: 18px; }
  .weather-icon { font-size: 48px; line-height: 1; }
  .weather-temp { font-size: 42px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .weather-desc { font-size: 14px; opacity: 0.85; margin-top: 4px; }
  .weather-meta { font-size: 12px; opacity: 0.75; line-height: 1.7; }

  .hero .total { font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .hero .total-label { font-size: 14px; opacity: 0.75; margin-top: 4px; }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .stat-item {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    min-width: 90px;
    text-align: center;
  }
  .stat-item .stat-num { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .stat-item .stat-label { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  /* ===== View switcher (日报 / 周报 / 月报) ===== */
  .reports {
    max-width: 1100px;
    margin: -30px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 5;
  }
  .reports-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .report-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow-md);
    color: inherit;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  }
  .report-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
  .report-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-light), var(--shadow-md);
  }
  .report-card.active .report-title { color: var(--accent); }
  .report-icon {
    width: 44px; height: 44px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px;
    flex-shrink: 0;
  }
  .report-icon.daily   { background: #eef0ff; }
  .report-icon.weekly  { background: #e6f6ec; }
  .report-icon.monthly { background: #fff2e0; }
  [data-theme="dark"] .report-icon.daily   { background: #2a2e4a; }
  [data-theme="dark"] .report-icon.weekly  { background: #1e3a2a; }
  [data-theme="dark"] .report-icon.monthly { background: #3a2e1a; }
  .report-body { flex: 1; min-width: 0; }
  .report-type { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.6px; }
  .report-title {
    font-size: 15px; font-weight: 600;
    color: var(--text);
    margin: 2px 0 3px;
    line-height: 1.4;
  }
  .report-meta { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

  /* ===== Nav + Toolbar ===== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  [data-theme="dark"] .nav { background: rgba(15,17,23,0.85); }
  .nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
    padding: 0 20px;
    overflow-x: auto;
  }
  .nav a {
    display: block;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .nav a:hover { color: var(--accent); }
  .nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

  .toolbar {
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 20px;
    border-top: 1px solid var(--border);
  }
  .search-input {
    flex: 1;
    min-width: 180px;
    max-width: 360px;
    padding: 8px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 5px 14px;
    border-radius: 99px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  /* ===== Main ===== */
  .main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }

  .section { margin-bottom: 48px; }
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent-light);
  }
  .section-header h2 { font-size: 20px; font-weight: 700; }
  .section-header .section-count { font-size: 13px; color: var(--text-muted); font-weight: 500; }
  .section-header .section-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
    font-weight: 400;
    text-align: right;
  }
  .section-header .section-note a { color: var(--accent); text-decoration: none; }
  .section-header .section-note a:hover { text-decoration: underline; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: box-shadow 0.2s, transform 0.2s, opacity 0.2s;
    position: relative;
    cursor: pointer;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card.read { opacity: 0.5; }
  .card.read:hover { opacity: 0.75; }
  .card.read .card-title { color: var(--text-muted); }
  .card.fav { border-color: #fbbf24; }
  .card-num {
    position: absolute;
    top: -10px; left: -10px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(99,102,241,0.35);
  }
  .card-fav {
    position: absolute;
    top: 12px; right: 12px;
    background: transparent;
    border: none;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    color: var(--text-muted);
    padding: 4px;
    z-index: 2;
    transition: transform 0.15s, color 0.15s;
  }
  .card-fav:hover { transform: scale(1.2); }
  .card-fav.on { color: #fbbf24; }
  .card-title {
    font-size: 15px; font-weight: 600; line-height: 1.5;
    margin-bottom: 8px; margin-top: 4px;
    color: var(--text);
    padding-right: 24px;
  }
  .card-meta {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .card-chip {
    display: inline-block;
    background: #f1f3f8; color: #4a4e6b;
    font-size: 12px; font-weight: 500;
    padding: 2px 10px; border-radius: 99px;
  }
  [data-theme="dark"] .card-chip { background: #2a2e3a; color: #a8adbf; }
  .card-time { font-size: 12px; color: var(--text-muted); }
  .card-summary {
    font-size: 13px; color: var(--text-secondary); line-height: 1.65;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-hotline {
    font-size: 12px;
    font-weight: 600;
    color: #d97706;
    margin-bottom: 8px;
    margin-top: -2px;
  }
  [data-theme="dark"] .card-hotline { color: #fbbf24; }
  .card-tap-hint {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }

  /* ===== Timeline (周报 / 月报脉络) ===== */
  .timeline { position: relative; padding-left: 30px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 8px; top: 10px; bottom: 10px;
    width: 2px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    display: block;
    padding: 14px 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .timeline-item:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
    transform: translateX(2px);
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -26px; top: 20px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }
  .timeline-date {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 5px;
    letter-spacing: 0.3px;
  }
  .timeline-title {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.65;
  }
  .timeline-group-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    margin: 22px 0 12px;
    padding-left: 2px;
    letter-spacing: 0.3px;
  }
  .timeline-group-title:first-child { margin-top: 0; }

  .empty-section {
    padding: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px dashed var(--border);
  }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 30, 0.55);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transform: translateY(20px) scale(0.98);
    transition: transform 0.25s ease;
  }
  .modal-backdrop.show .modal { transform: translateY(0) scale(1); }

  .modal-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header-content { flex: 1; min-width: 0; }
  .modal-num {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 99px;
    margin-bottom: 8px;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 8px;
  }
  .modal-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12px;
  }
  .modal-close {
    background: #f1f3f8;
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  [data-theme="dark"] .modal-close { background: #2a2e3a; }
  .modal-close:hover { background: #e2e5ee; }
  [data-theme="dark"] .modal-close:hover { background: #34394a; }

  .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .modal-summary {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-wrap: break-word;
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 14px 18px;
  }
  .modal-summary-loading {
    font-size: 14px;
    color: var(--text-muted);
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 14px 18px;
    font-style: italic;
  }
  .modal-summary-empty {
    font-size: 14px;
    color: var(--text-muted);
    font-style: italic;
    padding: 8px 4px;
  }
  .modal-context-latest {
    display: block;
    color: var(--text);
    font-weight: 600;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--border);
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .modal-source { font-size: 12px; color: var(--text-muted); }
  .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .modal-cta:hover { background: #4f46e5; }
  [data-theme="dark"] .modal-cta:hover { background: #6366f1; }
  .modal-cta.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .modal-cta.secondary:hover { background: var(--accent-light); }
  .modal-cta.disabled { background: #d1d5db; cursor: not-allowed; pointer-events: none; }
  .modal-cta.secondary.disabled {
    background: transparent;
    border-color: var(--border);
    color: var(--text-muted);
  }

  /* ===== Footer ===== */
  .footer {
    max-width: 1100px; margin: 0 auto;
    padding: 0 20px 40px; text-align: center;
  }
  .footer-inner {
    border-top: 1px solid var(--border);
    padding-top: 24px;
    color: var(--text-muted); font-size: 13px; line-height: 1.8;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  .error-banner {
    max-width: 1100px; margin: 16px 20px;
    background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
    padding: 12px 16px; font-size: 13px; color: #856404;
    display: none;
  }
  .error-banner.show { display: block; }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .hero { padding: 32px 16px 28px; }
    .hero h1 { font-size: 24px; }
    .hero .date-range { font-size: 20px; }
    .hero .date-range.loading-text { font-size: 16px; }
    .hero .total { font-size: 42px; }
    .stats-bar { gap: 10px; }
    .stat-item { padding: 10px 14px; min-width: 70px; }
    .stat-item .stat-num { font-size: 20px; }
    .cards { grid-template-columns: 1fr; }
    .main { padding: 24px 12px 36px; }
    .reports { margin-top: -22px; padding: 0 12px; }
    .reports-grid { grid-template-columns: 1fr; gap: 10px; }
    .section-header { flex-wrap: wrap; }
    .section-header .section-note { margin-left: 0; width: 100%; text-align: left; }
    .nav a { padding: 10px 14px; font-size: 13px; }
    .weather-now { gap: 14px; }
    .weather-icon { font-size: 40px; }
    .weather-temp { font-size: 36px; }
    .toolbar { padding: 8px 14px; }
    .search-input { max-width: none; }
  }
  @media (max-width: 480px) {
    .hero { padding: 24px 12px 22px; }
    .hero h1 { font-size: 22px; }

</style>

<script>
(function() {

const API_BASE = 'https://aihot.virxact.com/api/v1';
const UA = 'ai-daily-dashboard/1.0 (+https://aihot.virxact.com/aihot-skill/)';

// ===== LocalStorage state =====
const LS = {
  get(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
};
const LS_THEME = 'ai-daily-theme';
const LS_FAV = 'ai-daily-fav';
const LS_READ = 'ai-daily-read';
const LS_VIEW = 'ai-daily-view';

let theme = LS.get(LS_THEME, 'light');
let favorites = new Set(LS.get(LS_FAV, []));
let read = new Set(LS.get(LS_READ, []));
let searchQuery = '';
let filter = 'all'; // all | favorites | unread
let view = LS.get(LS_VIEW, 'daily'); // daily | weekly | monthly
if (!['daily', 'weekly', 'monthly'].includes(view)) view = 'daily';

// ===== City presets =====
const CITIES = {
  '广州': { lat: 23.13, lon: 113.26 },
  '北京': { lat: 39.90, lon: 116.41 },
  '上海': { lat: 31.23, lon: 121.47 },
  '深圳': { lat: 22.54, lon: 114.06 },
  '杭州': { lat: 30.27, lon: 120.15 },
  '成都': { lat: 30.57, lon: 104.07 },
  '武汉': { lat: 30.59, lon: 114.31 },
  '西安': { lat: 34.27, lon: 108.95 },
  '长沙': { lat: 28.23, lon: 112.94 },
  '苏州': { lat: 31.30, lon: 120.59 },
  '南京': { lat: 32.06, lon: 118.80 },
  '厦门': { lat: 24.48, lon: 118.09 },
};
const DEFAULT_CITY = '广州';
const LS_KEY_CITY = 'ai-daily-city';

// ===== Helpers =====
function itemKey(item) {
  const links = item.links || {};
  return links.aihot || links.original || (item.title + '|' + (item.source ? item.source.name : ''));
}
function isFav(k) { return favorites.has(k); }
function isRead(k) { return read.has(k); }
function toggleFav(k) {
  if (favorites.has(k)) favorites.delete(k); else favorites.add(k);
  LS.set(LS_FAV, [...favorites]);
}
function markRead(k) {
  if (!read.has(k)) { read.add(k); LS.set(LS_READ, [...read]); }
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  theme = theme === 'light' ? 'dark' : 'light';
  LS.set(LS_THEME, theme);
  applyTheme();
}

function weatherInfo(code) {
  const map = {
    0: ['☀️', '晴'], 1: ['🌤️', '大致晴'], 2: ['⛅', '局部多云'], 3: ['☁️', '多云'],
    45: ['🌫️', '雾'], 48: ['🌫️', '冰雾'],
    51: ['🌦️', '小毛毛雨'], 53: ['🌦️', '毛毛雨'], 55: ['🌧️', '大毛毛雨'],
    56: ['🌧️', '冻毛毛雨'], 57: ['🌧️', '大冻毛毛雨'],
    61: ['🌧️', '小雨'], 63: ['🌧️', '中雨'], 65: ['🌧️', '大雨'],
    66: ['🌧️', '冻雨'], 67: ['🌧️', '大冻雨'],
    71: ['🌨️', '小雪'], 73: ['🌨️', '中雪'], 75: ['❄️', '大雪'], 77: ['❄️', '雪粒'],
    80: ['🌦️', '小阵雨'], 81: ['🌦️', '中阵雨'], 82: ['⛈️', '大阵雨'],
    85: ['🌨️', '小阵雪'], 86: ['❄️', '大阵雪'],
    95: ['⛈️', '雷暴'], 96: ['⛈️', '雷雹（小）'], 99: ['⛈️', '雷雹（大）'],
  };
  return map[code] || ['🌡️', '未知'];
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8 * 3600000);
  return `${bj.getUTCFullYear()}年${bj.getUTCMonth()+1}月${bj.getUTCDate()}日 ` +
    `${String(bj.getUTCHours()).padStart(2,'0')}:${String(bj.getUTCMinutes()).padStart(2,'0')}`;
}
function getTime(entry) { return entry.latestAt || entry.publishedAt || entry.discoveredAt; }

const WD = ['周日','周一','周二','周三','周四','周五','周六'];
// "2026-09-09" -> "09-09 周三"
function dateLabel(dateStr) {
  const p = String(dateStr).split('-').map(Number);
  if (p.length < 3 || isNaN(p[0])) return dateStr;
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  return `${String(p[1]).padStart(2,'0')}-${String(p[2]).padStart(2,'0')} ${WD[d.getUTCDay()]}`;
}
// ISO 周序号（按 UTC 日期算，日期串固定无时区歧义）
function isoWeekOf(dateStr) {
  const p = String(dateStr).split('-').map(Number);
  const t = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  const dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  return { year: t.getUTCFullYear(), week: week };
}
// 当前北京时间的 ISO 周序号（用于周报卡片标签）
function isoWeekBJ() {
  const d = new Date(Date.now() + 8 * 3600000);
  return isoWeekOf(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);
}

function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.slice(0, max).replace(/\s+$/,'') + '...' : str;
}

async function fetchJSON(url) {
  const resp = await fetch(url, { headers: { 'User-Agent': UA } });
  if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
  return resp.json();
}

// ===== Weather =====
function getSavedCity() {
  try { const s = localStorage.getItem(LS_KEY_CITY); if (s && CITIES[s]) return s; } catch(e) {}
  return DEFAULT_CITY;
}
function saveCity(city) { try { localStorage.setItem(LS_KEY_CITY, city); } catch(e) {} }

async function loadWeather() {
  const weatherEl = document.getElementById('weather');
  const city = getSavedCity();
  let opts = '';
  for (const name of Object.keys(CITIES)) {
    opts += `<option value="${name}" ${name===city?'selected':''}>${name}</option>`;
  }
  weatherEl.innerHTML = `
    <div class="weather-head">
      <div class="weather-city"><span>📍</span><select id="city-select">${opts}</select></div>
      <div class="weather-update" id="weather-update"></div>
    </div>
    <div id="weather-body"><div class="weather-loading">正在加载天气...</div></div>
  `;
  document.getElementById('city-select').addEventListener('change', (e) => {
    saveCity(e.target.value); loadWeather();
  });

  const { lat, lon } = CITIES[city];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m&forecast_days=1`;
  try {
    const data = await fetchJSON(url);
    const cur = data.current || {};
    const [icon, desc] = weatherInfo(cur.weather_code);
    const temp = Math.round(cur.temperature_2m);
    const feels = Math.round(cur.apparent_temperature);
    const humidity = cur.relative_humidity_2m;
    const wind = Math.round(cur.wind_speed_10m);
    document.getElementById('weather-body').innerHTML = `
      <div class="weather-now">
        <div class="weather-icon">${icon}</div>
        <div style="flex:1;min-width:0">
          <div class="weather-temp">${temp}°C</div>
          <div class="weather-desc">${desc} · 体感 ${feels}°C</div>
          <div class="weather-meta">湿度 ${humidity}% · 风速 ${wind} km/h</div>
        </div>
      </div>`;
    const u = new Date(new Date(cur.time || new Date()).getTime() + 8 * 3600000);
    document.getElementById('weather-update').textContent =
      `更新于 ${u.getUTCMonth()+1}/${u.getUTCDate()} ${String(u.getUTCHours()).padStart(2,'0')}:${String(u.getUTCMinutes()).padStart(2,'0')}`;
  } catch (err) {
    document.getElementById('weather-body').innerHTML = `<div class="weather-loading">天气加载失败：${err.message || '未知错误'}</div>`;
  }
}

// ===== Views =====
// 每个视图有完全不同的版块构成：
//  - daily:   24h 五版块 + 热点（卡片墙）
//  - weekly:  本周每日官方导语时间线 + 本周 7d 精选
//  - monthly: 本月每日官方导语，按 ISO 周分组
const VIEWS = {
  daily: {
    label: 'AI 日报',
    badge: 'AIHOT 每日精选',
    totalLabel: '条精选资讯',
    sections: [
      { id: 'hot', label: '近期热点', hot: true },
      { id: 'models', label: '模型发布/更新', cat: 'ai-models' },
      { id: 'products', label: '产品发布/更新', cat: 'ai-products' },
      { id: 'industry', label: '行业动态', cat: 'industry' },
      { id: 'papers', label: '论文研究', cat: 'paper', fallback: true },
      { id: 'tips', label: '技巧与观点', cat: 'tip' },
    ],
  },
  weekly: {
    label: 'AI 周报',
    badge: 'AIHOT 本周脉络 · 官方每日导语',
    totalLabel: '条本周精选',
    sections: [
      { id: 'w-thread', label: '本周脉络', thread: true },
      { id: 'w-picks', label: '本周精选', picks: true },
    ],
  },
  monthly: {
    label: 'AI 月报',
    badge: 'AIHOT 本月脉络 · 官方每日导语',
    totalLabel: '天官方头条',
    sections: [
      { id: 'm-thread', label: '本月脉络', thread: true, groupByWeek: true },
    ],
  },
};

const WEEKLY_PICKS_CAP = 24; // 周报精选最多展示条数

async function fetchCategory(cat, fallbackMode) {
  let url = `${API_BASE}/items?mode=selected&window=24h&category=${cat}&limit=10`;
  let data = await fetchJSON(url);
  let items = data.items || [];
  if (items.length === 0 && fallbackMode) {
    url = `${API_BASE}/items?mode=all&window=7d&category=${cat}&limit=5`;
    data = await fetchJSON(url);
    items = data.items || [];
  }
  return { items };
}

// 日报归档 -> 官方每日导语时间线
function parseThread(d) {
  const items = (d && d.items) || [];
  return items
    .map(x => ({
      date: x.date,
      title: x.leadTitle || '',
      url: (x.links && x.links.aihot) || `https://aihot.virxact.com/daily/${x.date}`,
    }))
    .filter(x => x.date && x.title);
}

// Global state
let allItems = [];    // 当前视图的卡片条目
let threadData = [];  // 当前视图的时间线条目
let viewData = { daily: null, weekly: null, monthly: null }; // 视图数据缓存

function cardHTML(entry) {
  const item = entry.item;
  const time = fmtTime(getTime(item));
  const source = item.source ? item.source.name : '未知来源';
  const summary = truncate(item.summary || '', 110);
  const fav = isFav(entry.key);
  const rd = isRead(entry.key);
  const hotLine = entry.rank ? `<div class="card-hotline">🔥 #${entry.rank} · ${entry.sourceCount || 0} 个信源在聊</div>` : '';
  return `<div class="card ${rd ? 'read' : ''} ${fav ? 'fav' : ''}" data-num="${entry.num}">
    <div class="card-num">${entry.num}</div>
    <button class="card-fav ${fav ? 'on' : ''}" aria-label="收藏">${fav ? '★' : '☆'}</button>
    <div class="card-title">${item.title}</div>
    ${hotLine}
    <div class="card-meta">
      <span class="card-chip">${source}</span>
      <span class="card-time">${time}</span>
    </div>
    <p class="card-summary">${summary || '暂无摘要'}</p>
    <span class="card-tap-hint">点击查看详情 →</span>
  </div>`;
}

function threadItemHTML(r) {
  return `<a class="timeline-item" href="${r.url}" target="_blank" rel="noopener noreferrer">
    <div class="timeline-date">${dateLabel(r.date)}</div>
    <div class="timeline-title">${r.title}</div>
  </a>`;
}

function matchSearch(item) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  const hay = (item.title + ' ' + (item.summary || '') + ' ' + (item.source ? item.source.name : '')).toLowerCase();
  return hay.includes(q);
}

function visibleEntries() {
  return allItems.filter(e => {
    if (filter === 'favorites' && !isFav(e.key)) return false;
    if (filter === 'unread' && isRead(e.key)) return false;
    if (!matchSearch(e.item)) return false;
    return true;
  });
}

// 时间线只在「全部 + 有搜索词」时参与过滤；收藏/未读筛选下隐藏
function visibleThread() {
  if (filter !== 'all') return [];
  if (!searchQuery) return threadData;
  const q = searchQuery.toLowerCase();
  return threadData.filter(r => (r.title + ' ' + r.date).toLowerCase().includes(q));
}

// ===== Render (纯本地重绘，不重新拉数据) =====
function render() {
  const viewDef = VIEWS[view];
  const entries = visibleEntries();
  const bySection = {};
  for (const e of entries) (bySection[e.sectionId] = bySection[e.sectionId] || []).push(e);

  const isFiltered = (filter !== 'all') || !!searchQuery;
  let navHTML = '', statsHTML = '', mainHTML = '', shown = 0;

  for (const sec of viewDef.sections) {
    if (sec.thread) {
      const rows = visibleThread();
      if (rows.length === 0 && isFiltered) continue;
      shown += rows.length;
      navHTML += `<a href="#section-${sec.id}">${sec.label} (${rows.length})</a>`;
      statsHTML += `<div class="stat-item"><div class="stat-num">${rows.length}</div><div class="stat-label">${sec.label}</div></div>`;

      let bodyHTML = '';
      if (rows.length === 0) {
        bodyHTML = `<div class="empty-section">暂无数据</div>`;
      } else if (sec.groupByWeek) {
        const groups = {};
        for (const r of rows) {
          const iw = isoWeekOf(r.date);
          const k = `${iw.year}-W${String(iw.week).padStart(2, '0')}`;
          (groups[k] = groups[k] || []).push(r);
        }
        bodyHTML = '<div class="timeline">' + Object.keys(groups).sort().reverse().map(k => {
          const wk = k.split('-W')[1];
          const last = groups[k][0], first = groups[k][groups[k].length - 1];
          return `<div class="timeline-group-title">第 ${wk} 周 · ${first.date} ~ ${last.date} · ${groups[k].length} 天</div>` +
            groups[k].map(threadItemHTML).join('');
        }).join('') + '</div>';
      } else {
        bodyHTML = `<div class="timeline">${rows.map(threadItemHTML).join('')}</div>`;
      }

      const officialLink = view === 'weekly'
        ? `<a href="https://aihot.virxact.com/weekly" target="_blank" rel="noopener noreferrer">AIHOT 官方周报 ↗</a>`
        : `<a href="https://aihot.virxact.com/monthly" target="_blank" rel="noopener noreferrer">AIHOT 官方月报 ↗</a>`;
      mainHTML += `<section class="section" id="section-${sec.id}">
        <div class="section-header"><h2>${sec.label}</h2><span class="section-count">${rows.length} 天</span><span class="section-note">AIHOT 官方每日头条 · ${officialLink}</span></div>
        ${bodyHTML}
      </section>`;
    } else {
      const cards = bySection[sec.id] || [];
      if (cards.length === 0 && isFiltered) continue;
      shown += cards.length;
      navHTML += `<a href="#section-${sec.id}">${sec.label} (${cards.length})</a>`;
      statsHTML += `<div class="stat-item"><div class="stat-num">${cards.length}</div><div class="stat-label">${sec.label}</div></div>`;
      const noteHTML = sec.picks ? `<span class="section-note">过去 7 天精选 · 最多 ${WEEKLY_PICKS_CAP} 条</span>` : '';
      mainHTML += `<section class="section" id="section-${sec.id}">
        <div class="section-header"><h2>${sec.label}</h2><span class="section-count">${cards.length} 条</span>${noteHTML}</div>`;
      if (cards.length === 0) mainHTML += `<div class="empty-section">暂无数据</div>`;
      else mainHTML += `<div class="cards">${cards.map(cardHTML).join('')}</div>`;
      mainHTML += `</section>`;
    }
  }

  if (shown === 0) {
    mainHTML = `<div class="empty-section" style="margin-top:24px">没有匹配的资讯 😶</div>`;
  }

  document.getElementById('main-content').innerHTML = mainHTML;
  document.getElementById('nav-inner').innerHTML = navHTML;
  document.getElementById('hero-stats').innerHTML = statsHTML;
  document.getElementById('toolbar-count').textContent =
    `显示 ${shown} 条` + (filter !== 'all' ? ` · 筛选：${filter === 'favorites' ? '收藏' : '未读'}` : '') +
    (searchQuery ? ` · 搜索：${searchQuery}` : '');

  bindCards();
  initScrollSpy();
}

function bindCards() {
  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      const num = parseInt(el.dataset.num, 10);
      const entry = allItems.find(x => x.num === num);
      if (entry) openModal(entry);
    });
  });
  document.querySelectorAll('.card-fav').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const num = parseInt(btn.closest('.card').dataset.num, 10);
      const entry = allItems.find(x => x.num === num);
      if (entry) { toggleFav(entry.key); render(); }
    });
  });
}

// ===== Modal =====
function openModal(entry) {
  const item = entry.item;
  const time = fmtTime(getTime(item));
  const source = item.source ? item.source.name : '未知来源';
  const summary = item.summary || '';
  const links = item.links || {};
  const aihotUrl = links.aihot || '';
  const originalUrl = links.original || '';
  const storyMatch = (links.story || '').match(/story\/([a-f0-9-]+)/i);
  const storyPublicId = storyMatch ? storyMatch[1] : null;

  document.getElementById('modal-num').textContent = `序号 ${entry.num}`;
  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-source').textContent = source;
  document.getElementById('modal-time').textContent = time;
  document.getElementById('modal-source-detail').textContent = `来源：${source}`;

  const s = document.getElementById('modal-summary');
  if (summary) {
    s.className = 'modal-summary';
    s.textContent = summary;
  } else if (storyPublicId) {
    s.className = 'modal-summary-loading';
    s.textContent = '📡 正在加载 AIHOT 事件综述...';
    fetchJSON(`${API_BASE}/stories/${storyPublicId}`).then(d => {
      const story = (d && d.story) || {};
      const latest = story.latest || '';
      const digest = story.digest || '';
      if (!latest && !digest) {
        s.className = 'modal-summary-empty';
        s.textContent = '暂无摘要，请通过下方链接查看原文。';
        return;
      }
      s.className = 'modal-summary';
      s.innerHTML = '';
      if (latest) {
        const latestEl = document.createElement('span');
        latestEl.className = 'modal-context-latest';
        latestEl.textContent = '📌 最新：' + latest;
        s.appendChild(latestEl);
      }
      if (digest) {
        const digestEl = document.createElement('span');
        digestEl.textContent = digest;
        s.appendChild(digestEl);
      }
    }).catch(() => {
      s.className = 'modal-summary-empty';
      s.textContent = 'AIHOT 综述加载失败，请通过下方链接查看原文。';
    });
  } else {
    s.className = 'modal-summary-empty';
    s.textContent = '暂无摘要，请通过下方链接查看原文。';
  }

  const cta = document.getElementById('modal-cta');
  const ctaAihot = document.getElementById('modal-cta-aihot');
  if (aihotUrl) { ctaAihot.href = aihotUrl; ctaAihot.classList.remove('disabled'); }
  else { ctaAihot.removeAttribute('href'); ctaAihot.classList.add('disabled'); }

  if (originalUrl) { cta.href = originalUrl; cta.classList.remove('disabled'); cta.textContent = '查看原文 →'; }
  else { cta.removeAttribute('href'); cta.classList.add('disabled'); cta.textContent = '暂无原文'; }

  document.getElementById('modal-backdrop').classList.add('show');
  document.body.classList.add('modal-open');

  if (!isRead(entry.key)) { markRead(entry.key); render(); }
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('show');
  document.body.classList.remove('modal-open');
}

// ===== Data load =====
async function fetchViewData(name) {
  if (name === 'daily') {
    const cats = VIEWS.daily.sections.filter(s => !s.hot);
    const [daily, hot, ...catResults] = await Promise.all([
      fetchJSON(`${API_BASE}/dailies/latest`).catch(() => null),
      fetchJSON(`${API_BASE}/hot-topics`).catch(() => null),
      ...cats.map(s => fetchCategory(s.cat, s.fallback).catch(() => ({ items: [] }))),
    ]);
    return { daily, hot, cats, catResults };
  }
  if (name === 'weekly') {
    const [thread, picks] = await Promise.all([
      fetchJSON(`${API_BASE}/dailies?limit=7`).catch(() => null),
      fetchJSON(`${API_BASE}/items?mode=selected&window=7d&limit=50`).catch(() => null),
    ]);
    return { thread: parseThread(thread), picks: (picks && picks.items) || [] };
  }
  // monthly
  const thread = await fetchJSON(`${API_BASE}/dailies?limit=30`).catch(() => null);
  return { thread: parseThread(thread) };
}

function applyView(name) {
  view = name;
  LS.set(LS_VIEW, view);
  const d = viewData[name];
  const viewDef = VIEWS[name];

  allItems = [];
  threadData = d.thread || [];
  let globalNum = 0;

  if (name === 'daily') {
    if (d.hot && d.hot.items && d.hot.items.length) {
      for (const item of d.hot.items.slice(0, 5)) {
        globalNum++;
        allItems.push({
          item, num: globalNum, key: itemKey(item), sectionId: 'hot',
          rank: item.rank, sourceCount: item.sourceCount, signalCount: item.signalCount,
        });
      }
    }
    const cats = d.cats;
    for (let i = 0; i < cats.length; i++) {
      for (const item of (d.catResults[i].items || [])) {
        globalNum++;
        allItems.push({ item, num: globalNum, key: itemKey(item), sectionId: cats[i].id });
      }
    }
  } else if (name === 'weekly') {
    for (const item of (d.picks || [])) {
      if (globalNum >= WEEKLY_PICKS_CAP) break;
      globalNum++;
      allItems.push({ item, num: globalNum, key: itemKey(item), sectionId: 'w-picks' });
    }
  }
  // monthly 只有时间线，无卡片条目

  // ---- Hero ----
  document.getElementById('hero-title').textContent = viewDef.label;
  document.getElementById('hero-badge').textContent = viewDef.badge;
  document.getElementById('hero-total-label').textContent = viewDef.totalLabel;
  document.title = viewDef.label;

  let dateLine = '';
  if (name === 'daily') {
    const r = (d.daily && d.daily.report) || null;
    if (r && r.windowStart && r.windowEnd) {
      const bj = (utc) => { const t = new Date(utc.getTime() + 8*3600000); return `${t.getUTCFullYear()}年${t.getUTCMonth()+1}月${t.getUTCDate()}日 ${String(t.getUTCHours()).padStart(2,'0')}:00`; };
      dateLine = `${bj(new Date(r.windowStart))} — ${bj(new Date(r.windowEnd))}（北京时间）`;
    } else {
      const bj = new Date(Date.now() + 8*3600000);
      dateLine = `${bj.getUTCFullYear()}年${bj.getUTCMonth()+1}月${bj.getUTCDate()}日（北京时间）`;
    }
  } else {
    const t = threadData;
    if (t.length) {
      const first = t[t.length - 1], last = t[0];
      dateLine = `${first.date} 至 ${last.date} · 共 ${t.length} 天`;
    } else {
      dateLine = '暂无归档数据';
    }
  }

  document.getElementById('hero-date').textContent = dateLine || '数据加载中...';
  document.getElementById('hero-date').classList.remove('loading-text');
  document.getElementById('hero-total').textContent =
    name === 'monthly' ? threadData.length : (name === 'weekly' ? allItems.length : allItems.length);

  // ---- 三个视图卡片的摘要 ----
  const dd = viewData.daily;
  const dr = (dd && dd.daily && dd.daily.report) || null;
  if (dr) {
    let cnt = 0;
    for (const s of (dr.sections || [])) cnt += (s.items || []).length;
    cnt += (dr.flashes || []).length;
    document.getElementById('report-daily-meta').textContent =
      (cnt > 0 ? `${dr.date} · ${cnt} 篇` : `${dr.date}`) + ' · 五版块 + 热点';
  } else {
    document.getElementById('report-daily-meta').textContent = '五版块 + 近期热点';
  }
  const iw = isoWeekBJ();
  document.getElementById('report-weekly-meta').textContent =
    `VOL.${iw.year}-W${String(iw.week).padStart(2, '0')} · 7 天脉络 + 精选`;
  const nowBJ = new Date(Date.now() + 8 * 3600000);
  document.getElementById('report-monthly-meta').textContent =
    `${nowBJ.getUTCFullYear()}年${nowBJ.getUTCMonth()+1}月 · 30 期日报脉络`;

  // ---- 切换器高亮 ----
  document.querySelectorAll('.report-card').forEach(el => {
    el.classList.toggle('active', el.dataset.view === name);
  });

  // ---- Footer ----
  const genTime = fmtTime(new Date().toISOString());
  const dailyUrl = (viewData.daily && viewData.daily.daily && viewData.daily.daily.report &&
    viewData.daily.daily.report.links && viewData.daily.daily.report.links.aihot) || 'https://aihot.virxact.com/daily';
  document.getElementById('footer-inner').innerHTML = `
    <p>当前视图：<strong>${viewDef.label}</strong> · AI 数据：<a href="${dailyUrl}" target="_blank" rel="noopener noreferrer">AIHOT 日报</a> · <a href="https://aihot.virxact.com/weekly" target="_blank" rel="noopener noreferrer">官网周报</a> · <a href="https://aihot.virxact.com/monthly" target="_blank" rel="noopener noreferrer">官网月报</a> · 热点：<a href="https://aihot.virxact.com/hot" target="_blank" rel="noopener noreferrer">AIHOT 热点</a> · 天气：<a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
    <p style="margin-top:6px;font-size:12px">周报／月报由 AIHOT 日报归档的官方每日导语聚合而成 · 页面生成时间：${genTime}（北京时间）· 数据实时拉取，每次刷新即最新</p>
  `;

  render();
}

async function loadView(name, force) {
  if (viewData[name] && !force) { applyView(name); return; }
  document.getElementById('hero-date').textContent = '正在拉取数据...';
  document.getElementById('hero-date').classList.add('loading-text');
  document.getElementById('hero-total').textContent = '—';
  document.getElementById('main-content').innerHTML = '';
  document.getElementById('error-banner').classList.remove('show');
  try {
    viewData[name] = await fetchViewData(name);
    applyView(name);
  } catch (err) {
    handleError(err);
  }
}

// ===== Scroll spy =====
function initScrollSpy() {
  const nav = document.getElementById('nav');
  const links = nav.querySelectorAll('a');
  const sections = [];
  links.forEach(a => {
    const id = a.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) sections.push({ link: a, el });
  });
  function onScroll() {
    if (sections.length === 0) return;
    let current = sections[0];
    const scrollY = window.scrollY + nav.offsetHeight + 20;
    for (const s of sections) { if (s.el.offsetTop <= scrollY) current = s; }
    links.forEach(a => a.classList.remove('active'));
    if (current) current.link.classList.add('active');
  }
  window.removeEventListener('scroll', onScroll);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

// ===== Events =====
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

document.getElementById('reports-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.report-card');
  if (!btn) return;
  const name = btn.dataset.view;
  if (name === view) return;
  loadView(name);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  render();
});

document.getElementById('filter-chips').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-chip');
  if (!btn) return;
  if (btn.id === 'mark-all-read') {
    for (const x of allItems) read.add(x.key);
    LS.set(LS_READ, [...read]);
    render();
    return;
  }
  filter = btn.dataset.filter;
  document.querySelectorAll('.filter-chip[data-filter]').forEach(c => c.classList.toggle('active', c === btn));
  render();
});

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-backdrop')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function handleError(err) {
  const banner = document.getElementById('error-banner');
  banner.textContent = '数据加载失败：' + (err.message || '未知错误') + '。请检查网络后刷新页面重试。';
  banner.classList.add('show');
  document.getElementById('hero-date').textContent = '数据加载失败';
  document.getElementById('hero-date').classList.remove('loading-text');
}

// ===== Init =====
applyTheme();
loadWeather();
loadView(view).catch(handleError);

})();
</script>
