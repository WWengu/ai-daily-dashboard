<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报 · 周报 · 月报</title>
<style>
  :root {
    --bg: #f4f4f5;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --text: #09090b;
    --text-2: #52525b;
    --text-3: #a1a1aa;
    --border: #e4e4e7;
    --primary: #6366f1;
    --primary-text: #ffffff;
    --primary-hover: #4f46e5;
    --accent: #6366f1;
    --accent-soft: #eef0ff;
    --hero-bg: linear-gradient(135deg, #4f46e5 0%, #6366f1 55%, #7c6cf0 100%);

    --radius-sm: 6px;
    --radius: 8px;
    --radius-lg: 12px;
    --radius-full: 999px;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-2: 0 4px 16px rgba(0, 0, 0, 0.08);

    --dur: 150ms;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  [data-theme="dark"] {
    --bg: #09090b;
    --surface: #18181b;
    --surface-2: #27272a;
    --text: #fafafa;
    --text-2: #a1a1aa;
    --text-3: #71717a;
    --border: #27272a;
    --primary: #818cf8;
    --primary-text: #0b0b12;
    --primary-hover: #6366f1;
    --accent: #818cf8;
    --accent-soft: #1e2140;
    --hero-bg: linear-gradient(135deg, #312e81 0%, #4338ca 55%, #5b4fd6 100%);

    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 104px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }

  body.modal-open { overflow: hidden; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }

  .icon {
    width: 1em;
    height: 1em;
    display: inline-block;
    vertical-align: -0.14em;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon-lg { width: 1.25em; height: 1.25em; }
  .icon-xl { width: 1.6em; height: 1.6em; }
  .icon-solid { fill: currentColor; stroke: none; }

  /* ===== Hero ===== */
  .hero {
    background: var(--hero-bg);
    color: #fff;
    padding: 48px 24px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
  }

  .hero-badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.22);
  }

  .hero h1 {
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
    line-height: 1.25;
  }

  .hero .date-range {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0;
    margin-bottom: 24px;
    opacity: 0.88;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }

  .hero .date-range.loading-text {
    font-size: 15px;
    opacity: 0.8;
  }

  .theme-toggle {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    border-radius: var(--radius);
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: background var(--dur) var(--ease);
  }
  .theme-toggle:hover { background: rgba(255, 255, 255, 0.24); }

  /* ===== Weather ===== */
  .weather {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    margin: 0 auto 26px;
    max-width: 640px;
    text-align: left;
  }

  .weather-loading {
    font-size: 13px;
    opacity: 0.85;
    text-align: center;
    padding: 10px;
  }

  .weather-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .weather-city {
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .weather-city select {
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
  }
  .weather-city select option { color: #09090b; background: #fff; }

  .weather-update {
    font-size: 11px;
    opacity: 0.68;
    font-variant-numeric: tabular-nums;
  }

  .weather-now {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .weather-icon {
    width: 52px;
    height: 52px;
    stroke: rgba(255, 255, 255, 0.92);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .weather-temp {
    font-size: 42px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .weather-desc {
    font-size: 13px;
    opacity: 0.82;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .weather-meta {
    font-size: 12px;
    opacity: 0.72;
    line-height: 1.7;
    font-variant-numeric: tabular-nums;
  }

  .hero .total {
    font-size: 44px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }

  .hero .total-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    opacity: 0.75;
    margin-top: 6px;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 22px;
  }

  .stat-item {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: var(--radius);
    padding: 11px 16px;
    min-width: 88px;
    text-align: center;
  }

  .stat-item .stat-num {
    font-size: 20px;
    font-weight: 500;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
  }

  .stat-item .stat-label {
    font-size: 11px;
    letter-spacing: 0.04em;
    opacity: 0.72;
    margin-top: 2px;
  }

  /* ===== View switcher ===== */
  .reports {
    max-width: 1120px;
    margin: -28px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 5;
  }

  .reports-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }

  .report-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    color: inherit;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .report-card:hover { border-color: var(--accent); }
  .report-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  [data-theme="dark"] .report-card { box-shadow: var(--shadow-1); }

  .report-icon {
    width: 42px;
    height: 42px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    background: var(--accent-soft);
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .report-icon svg { width: 21px; height: 21px; }

  .report-body { flex: 1; min-width: 0; }

  .report-type {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 500;
    letter-spacing: 0.06em;
  }

  .report-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin: 3px 0 2px;
    line-height: 1.35;
  }
  .report-card.active .report-title { color: var(--accent); }

  .report-meta {
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.45;
  }

  /* ===== Nav + Toolbar ===== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
    margin-top: 28px;
  }
  [data-theme="dark"] .nav {
    background: rgba(9, 9, 11, 0.92);
  }

  .nav-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    gap: 2px;
    padding: 0 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display: none; }

  .nav a {
    display: block;
    padding: 13px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    text-decoration: none;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .nav a:hover { color: var(--text); }
  .nav a.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .toolbar {
    max-width: 1120px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
  }

  .search-input {
    flex: 1;
    min-width: 180px;
    max-width: 340px;
    height: 36px;
    padding: 0 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color var(--dur) var(--ease);
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }

  .filter-chips { display: flex; gap: 7px; flex-wrap: wrap; }

  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    height: 32px;
    padding: 0 13px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all var(--dur) var(--ease);
    white-space: nowrap;
  }
  .filter-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .filter-chip.active {
    background: var(--accent);
    color: var(--primary-text);
    border-color: var(--accent);
  }
  .filter-chip .icon { width: 13px; height: 13px; }

  .toolbar-count {
    font-size: 12px;
    color: var(--text-3);
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  /* ===== Main ===== */
  .main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 36px 20px 56px;
  }

  .section { margin-bottom: 44px; }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .section-header h2 {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .section-header .section-count {
    font-size: 12px;
    color: var(--text-3);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }

  .section-header .section-note {
    font-size: 12px;
    color: var(--text-3);
    margin-left: auto;
    font-weight: 400;
    text-align: right;
    line-height: 1.5;
  }
  .section-header .section-note a { color: var(--accent); }
  .section-header .section-note a:hover { text-decoration: underline; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }

  /* ===== Card ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    position: relative;
    cursor: pointer;
    transition: border-color var(--dur) var(--ease), opacity var(--dur) var(--ease);
  }
  .card:hover { border-color: var(--accent); }
  [data-theme="dark"] .card { box-shadow: var(--shadow-1); }

  .card.read { opacity: 0.5; }
  .card.read:hover { opacity: 0.72; }
  .card.read .card-title { color: var(--text-2); }

  .card.fav { border-color: var(--accent); }

  .card-num {
    position: absolute;
    top: -9px;
    left: -9px;
    min-width: 26px;
    height: 26px;
    padding: 0 7px;
    border-radius: var(--radius-full);
    background: var(--primary);
    color: var(--primary-text);
    font-size: 11px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  [data-theme="dark"] .card-num { box-shadow: var(--shadow-1); }

  .card-fav {
    position: absolute;
    top: 12px;
    right: 12px;
    background: transparent;
    border: none;
    width: 26px;
    height: 26px;
    cursor: pointer;
    color: var(--text-3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: color var(--dur) var(--ease);
  }
  .card-fav:hover { color: var(--accent); }
  .card-fav.on { color: var(--accent); }
  .card-fav .icon { width: 17px; height: 17px; }

  .card-title {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.55;
    margin-bottom: 8px;
    margin-top: 3px;
    color: var(--text);
    padding-right: 22px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .card-chip {
    display: inline-block;
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: var(--radius-full);
  }

  .card-time {
    font-size: 11px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .card-summary {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-hotline {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    margin: -1px 0 8px;
  }
  .card-hotline .icon { width: 13px; height: 13px; }

  .card-tap-hint {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .card:hover .card-tap-hint {
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== Timeline ===== */
  .timeline {
    position: relative;
    padding-left: 30px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 12px;
    bottom: 12px;
    width: 1px;
    background: var(--border);
  }

  .timeline-item {
    position: relative;
    display: block;
    padding: 15px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 11px;
    text-decoration: none;
    color: inherit;
    transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .timeline-item:hover {
    border-color: var(--accent);
    transform: translateX(2px);
  }
  .timeline-item:hover .timeline-hint { opacity: 1; }
  [data-theme="dark"] .timeline-item { box-shadow: var(--shadow-1); }

  .timeline-item::before {
    content: '';
    position: absolute;
    left: -25px;
    top: 21px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }

  .timeline-date {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 5px;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .timeline-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.65;
  }

  .timeline-hint {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
    opacity: 0;
    transition: opacity var(--dur) var(--ease);
  }
  .timeline-hint .icon { width: 12px; height: 12px; }

  .timeline-group-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-3);
    margin: 24px 0 12px;
    padding-left: 2px;
    letter-spacing: 0.03em;
    scroll-margin-top: 116px;
    font-variant-numeric: tabular-nums;
  }
  .timeline-group-title:first-child { margin-top: 0; }

  /* ===== Monthly: stats + highlights ===== */
  .m-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }

  .m-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 12px;
    text-align: center;
  }
  [data-theme="dark"] .m-stat { box-shadow: var(--shadow-1); }

  .m-stat-num {
    font-size: 26px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1.2;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .m-stat-label {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 4px;
    letter-spacing: 0.03em;
  }

  .hl-list { display: flex; flex-direction: column; gap: 10px; }

  .hl-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 18px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    width: 100%;
    color: inherit;
    transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .hl-item:hover {
    border-color: var(--accent);
    transform: translateX(2px);
  }
  [data-theme="dark"] .hl-item { box-shadow: var(--shadow-1); }

  .hl-num {
    font-size: 18px;
    font-weight: 500;
    color: var(--accent);
    width: 32px;
    flex-shrink: 0;
    opacity: 0.85;
    font-variant-numeric: tabular-nums;
  }

  .hl-body { flex: 1; min-width: 0; }

  .hl-week {
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 3px;
    font-variant-numeric: tabular-nums;
  }

  .hl-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.55;
  }

  .hl-meta {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  /* ===== Digest (modal content) ===== */
  .daily-digest { font-size: 14px; }

  .digest-section { margin-bottom: 20px; }
  .digest-section:last-child { margin-bottom: 0; }

  .digest-section-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 11px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--border);

    color: var(--text-3);

  .empty-section {

    color: var(--text-3);

    height: 28px;

  .modal-backdrop {

    inset: 0;
    background: rgba(9, 9, 11, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) var(--ease);
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 22px;
    border-bottom: 1px solid var(--border);
  }

  .modal-header-content { flex: 1; min-width: 0; }

  .modal-num {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    margin-bottom: 9px;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 8px;
  }

  .modal-meta {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .modal-close {
    background: var(--surface-2);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: var(--radius);

    color: var(--text-2);

    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .modal-close:hover {
    background: var(--border);
    color: var(--text);
  }
  .modal-close .icon { width: 15px; height: 15px; }

  .modal-body {
    padding: 20px 22px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-summary {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-2);
    white-space: pre-wrap;
    word-wrap: break-word;
    background: var(--accent-soft);
    border-left: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 15px 18px;
  }

  .modal-summary-loading {
    font-size: 13px;
    color: var(--text-3);

    gap: 9px;
    line-height: 1.7;
    white-space: pre-wrap;

    height: 15px;

  .modal-summary-empty {

    color: var(--text-3);

    height: 13px;
    color: var(--accent);
    margin-right: 4px;

  .modal-source {
    font-size: 11px;
    color: var(--text-3);
  }

  .modal-actions {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
  }

  .modal-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 18px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;

    transition: background var(--dur) var(--ease), color var(--dur) var(--ease),

  }

    border-color: var(--primary);

  .modal-cta:not(.secondary):hover { background: var(--primary-hover); border-color: var(--primary-hover); }

  .modal-cta.secondary {
    background: transparent;

    border-color: var(--border);

  .modal-cta.secondary:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .modal-cta.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* ===== Footer ===== */
  .footer {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 20px 44px;
    text-align: center;
  }

  .footer-inner {

    color: var(--text-3);

    line-height: 1.9;

  /* ===== Error banner ===== */
  .error-banner {
    max-width: 1120px;
    margin: 16px auto 0;
    padding: 12px 18px;

    display: none;
  }
  .error-banner.show { display: block; }

  /* ===== Animations ===== */
  @keyframes spin {

  @media (prefers-reduced-motion: no-preference) {

  }

  @media (prefers-reduced-motion: reduce) {

</head>

// 把 [data-icon="xxx"] 占位替换成 ICONS 里的 SVG。可重复调用（已注入的跳过）。

function markRead(k) {

function weatherInfo(code) {

    56: [ICONS.wRain, '冻毛毛雨'], 57: [ICONS.wRain, '大冻毛毛雨'],
    61: [ICONS.wRain, '小雨'], 63: [ICONS.wRain, '中雨'], 65: [ICONS.wHeavyRain, '大雨'],
    66: [ICONS.wRain, '冻雨'], 67: [ICONS.wHeavyRain, '大冻雨'],

    80: [ICONS.wDrizzle, '小阵雨'], 81: [ICONS.wRain, '中阵雨'], 82: [ICONS.wHeavyRain, '大阵雨'],

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8 * 3600000);
  return `${bj.getUTCFullYear()}年${bj.getUTCMonth()+1}月${bj.getUTCDate()}日 ` +
    `${String(bj.getUTCHours()).padStart(2,'0')}:${String(bj.getUTCMinutes()).padStart(2,'0')}`;
}
function getTime(entry) { return entry.latestAt || entry.publishedAt || entry.discoveredAt; }

const WD = ['周日','周一','周二','周三','周四','周五','周六'];
// "2026-09-09" -> "09-09 周三"
function dateLabel(dateStr) {
  const p = String(dateStr).split('-').map(Number);
  if (p.length < 3 || isNaN(p[0])) return dateStr;
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  return `${String(p[1]).padStart(2,'0')}-${String(p[2]).padStart(2,'0')} ${WD[d.getUTCDay()]}`;
}
// ISO 周序号（按 UTC 日期算，日期串固定无时区歧义）
function isoWeekOf(dateStr) {
  const p = String(dateStr).split('-').map(Number);
  const t = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  const dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  return { year: t.getUTCFullYear(), week: week };
}
// 当前北京时间的 ISO 周序号（用于周报卡片标签）
function isoWeekBJ() {
  const d = new Date(Date.now() + 8 * 3600000);
  return isoWeekOf(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);
}

function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.slice(0, max).replace(/\s+$/,'') + '...' : str;
}

async function fetchJSON(url) {
  // 不设置 User-Agent：浏览器无法可靠设置该头，且会触发 CORS 预检；
  // AIHOT 的 Access-Control-Allow-Headers 不含 user-agent，预检会被拒。
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
  return resp.json();
}

// ===== Weather =====
function getSavedCity() {
  try { const s = localStorage.getItem(LS_KEY_CITY); if (s && CITIES[s]) return s; } catch(e) {}
  return DEFAULT_CITY;
}
function saveCity(city) { try { localStorage.setItem(LS_KEY_CITY, city); } catch(e) {} }

async function loadWeather() {
  const weatherEl = document.getElementById('weather');
  const city = getSavedCity();
  let opts = '';
  for (const name of Object.keys(CITIES)) {
    opts += `<option value="${name}" ${name===city?'selected':''}>${name}</option>`;
  }
  weatherEl.innerHTML = `
    <div class="weather-head">
      <div class="weather-city"><span class="icon" data-icon="pin" style="width:15px;height:15px"></span><select id="city-select">${opts}</select></div>
      <div class="weather-update" id="weather-update"></div>
    </div>
    <div id="weather-body"><div class="weather-loading">正在加载天气...</div></div>
  `;
  hydrateIcons(weatherEl);
  document.getElementById('city-select').addEventListener('change', (e) => {
    saveCity(e.target.value); loadWeather();
  });

  const { lat, lon } = CITIES[city];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m&forecast_days=1`;
  try {
    const data = await fetchJSON(url);
    const cur = data.current || {};
    const [icon, desc] = weatherInfo(cur.weather_code);
    const temp = Math.round(cur.temperature_2m);
    const feels = Math.round(cur.apparent_temperature);
    const humidity = cur.relative_humidity_2m;
    const wind = Math.round(cur.wind_speed_10m);
    document.getElementById('weather-body').innerHTML = `
      <div class="weather-now">
        <div class="weather-icon">${icon}</div>
        <div style="flex:1;min-width:0">
          <div class="weather-temp">${temp}°C</div>
          <div class="weather-desc">${desc} · 体感 ${feels}°C</div>
          <div class="weather-meta">湿度 ${humidity}% · 风速 ${wind} km/h</div>
        </div>
      </div>`;
    const u = new Date(new Date(cur.time || new Date()).getTime() + 8 * 3600000);
    document.getElementById('weather-update').textContent =
      `更新于 ${u.getUTCMonth()+1}/${u.getUTCDate()} ${String(u.getUTCHours()).padStart(2,'0')}:${String(u.getUTCMinutes()).padStart(2,'0')}`;
  } catch (err) {
    document.getElementById('weather-body').innerHTML = `<div class="weather-loading">天气加载失败：${err.message || '未知错误'}</div>`;
  }
}

async function fetchCategory(cat, fallbackMode) {
  let url = `${API_BASE}/items?mode=selected&window=24h&category=${cat}&limit=10`;
  let data = await fetchJSON(url);
  let items = data.items || [];
  if (items.length === 0 && fallbackMode) {
    url = `${API_BASE}/items?mode=all&window=7d&category=${cat}&limit=5`;
    data = await fetchJSON(url);
    items = data.items || [];
  }
  return { items };
}

// 日报归档 -> 官方每日导语时间线
function parseThread(d) {
  const items = (d && d.items) || [];
  return items
    .map(x => ({
      date: x.date,
      title: x.leadTitle || '',
      url: (x.links && x.links.aihot) || `https://aihot.virxact.com/daily/${x.date}`,
    }))
    .filter(x => x.date && x.title);
}

// 按 ISO 周分组（threadData 本身按日期倒序），返回最新周在前
function groupThreadByWeek(rows) {
  const groups = {};
  for (const r of rows) {
    const iw = isoWeekOf(r.date);
    const k = `${iw.year}-W${String(iw.week).padStart(2, '0')}`;
    (groups[k] = groups[k] || []).push(r);
  }
  return Object.keys(groups).sort().reverse().map(k => ({
    key: k,
    week: k.split('-W')[1],
    days: groups[k],
  }));
}

// Global state
let allItems = [];    // 当前视图的卡片条目
let threadData = [];  // 当前视图的时间线条目
let viewData = { daily: null, weekly: null, monthly: null }; // 视图数据缓存

function cardHTML(entry) {
  const item = entry.item;
  const time = fmtTime(getTime(item));
  const source = item.source ? item.source.name : '未知来源';
  const summary = truncate(item.summary || '', 110);
  const fav = isFav(entry.key);
  const rd = isRead(entry.key);
  const hotLine = entry.rank ? `<div class="card-hotline">${ICONS.flame} #${entry.rank} · ${entry.sourceCount || 0} 个信源在聊</div>` : '';
  return `<div class="card ${rd ? 'read' : ''} ${fav ? 'fav' : ''}" data-num="${entry.num}">
    <div class="card-num">${entry.num}</div>
    <button class="card-fav ${fav ? 'on' : ''}" aria-label="收藏">${fav ? ICONS.starFilled : ICONS.star}</button>
    <div class="card-title">${item.title}</div>
    ${hotLine}
    <div class="card-meta">
      <span class="card-chip">${source}</span>
      <span class="card-time">${time}</span>
    </div>
    <p class="card-summary">${summary || '暂无摘要'}</p>
    <span class="card-tap-hint">点击查看详情 →</span>
  </div>`;
}

function threadItemHTML(r) {
  return `<a class="timeline-item" href="${r.url}" data-date="${r.date}" target="_blank" rel="noopener noreferrer">
    <div class="timeline-date">${dateLabel(r.date)}</div>
    <div class="timeline-title">${r.title}</div>
    <span class="timeline-hint">展开当日日报概览 →</span>
  </a>`;
}

function matchSearch(item) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  const hay = (item.title + ' ' + (item.summary || '') + ' ' + (item.source ? item.source.name : '')).toLowerCase();
  return hay.includes(q);
}

function visibleEntries() {
  return allItems.filter(e => {
    if (filter === 'favorites' && !isFav(e.key)) return false;
    if (filter === 'unread' && isRead(e.key)) return false;
    if (!matchSearch(e.item)) return false;
    return true;
  });
}

// 时间线只在「全部 + 有搜索词」时参与过滤；收藏/未读筛选下隐藏
function visibleThread() {
  if (filter !== 'all') return [];
  if (!searchQuery) return threadData;
  const q = searchQuery.toLowerCase();
  return threadData.filter(r => (r.title + ' ' + r.date).toLowerCase().includes(q));
}

// ===== Render (纯本地重绘，不重新拉数据) =====
function render() {
  const viewDef = VIEWS[view];
  const entries = visibleEntries();
  const bySection = {};
  for (const e of entries) (bySection[e.sectionId] = bySection[e.sectionId] || []).push(e);

  const isFiltered = (filter !== 'all') || !!searchQuery;
  let navHTML = '', statsHTML = '', mainHTML = '', shown = 0;

  for (const sec of viewDef.sections) {
    if (sec.highlights) {
      // 月报「本期看点」：官方月报同款结构（统计条 + 编号看点），按周提炼
      const rows = visibleThread();
      if (rows.length === 0 && isFiltered) continue;
      const weeks = groupThreadByWeek(rows);
      shown += weeks.length;
      navHTML += `<a href="#section-${sec.id}">${sec.label} (${weeks.length})</a>`;
      statsHTML += `<div class="stat-item"><div class="stat-num">${weeks.length}</div><div class="stat-label">${sec.label}</div></div>`;

      const bodyHTML = weeks.length === 0
        ? `<div class="empty-section">暂无数据</div>`
        : `<div class="m-stats">
            <div class="m-stat"><div class="m-stat-num">${rows.length}</div><div class="m-stat-label">天官方脉络</div></div>
            <div class="m-stat"><div class="m-stat-num">${weeks.length}</div><div class="m-stat-label">周看点</div></div>
            <div class="m-stat"><div class="m-stat-num">${rows.length}</div><div class="m-stat-label">期日报汇聚</div></div>
          </div>
          <div class="hl-list">${weeks.map((w, i) => `
            <button class="hl-item" type="button" data-week="${w.key}">
              <div class="hl-num">${String(i + 1).padStart(2, '0')}</div>
              <div class="hl-body">
                <div class="hl-week">第 ${w.week} 周 · ${w.days[w.days.length - 1].date} ~ ${w.days[0].date}</div>
                <div class="hl-title">${w.days[0].title}</div>
                <div class="hl-meta">${w.days.length} 天脉络 · 点击定位该周详情 →</div>
              </div>
            </button>`).join('')}</div>`;

      mainHTML += `<section class="section" id="section-${sec.id}">
        <div class="section-header"><h2>${sec.label}</h2><span class="section-count">${weeks.length} 周</span><span class="section-note">按周提炼头条 · 点击定位该周脉络</span></div>
        ${bodyHTML}
      </section>`;
    } else if (sec.thread) {
      const rows = visibleThread();
      if (rows.length === 0 && isFiltered) continue;
      shown += rows.length;
      navHTML += `<a href="#section-${sec.id}">${sec.label} (${rows.length})</a>`;
      statsHTML += `<div class="stat-item"><div class="stat-num">${rows.length}</div><div class="stat-label">${sec.label}</div></div>`;

      let bodyHTML = '';
      if (rows.length === 0) {
        bodyHTML = `<div class="empty-section">暂无数据</div>`;
      } else if (sec.groupByWeek) {
        bodyHTML = '<div class="timeline">' + groupThreadByWeek(rows).map(w => {
          const first = w.days[w.days.length - 1], last = w.days[0];
          return `<div class="timeline-group-title" id="week-${w.key}">第 ${w.week} 周 · ${first.date} ~ ${last.date} · ${w.days.length} 天</div>` +
            w.days.map(threadItemHTML).join('');
        }).join('') + '</div>';
      } else {
        bodyHTML = `<div class="timeline">${rows.map(threadItemHTML).join('')}</div>`;
      }

      const officialLink = view === 'weekly'
        ? `<a href="https://aihot.virxact.com/weekly" target="_blank" rel="noopener noreferrer">AIHOT 官方周报 ↗</a>`
        : `<a href="https://aihot.virxact.com/monthly" target="_blank" rel="noopener noreferrer">AIHOT 官方月报 ↗</a>`;
      mainHTML += `<section class="section" id="section-${sec.id}">
        <div class="section-header"><h2>${sec.label}</h2><span class="section-count">${rows.length} 天</span><span class="section-note">AIHOT 官方每日头条 · ${officialLink}</span></div>
        ${bodyHTML}
      </section>`;
    } else {
      const cards = bySection[sec.id] || [];
      if (cards.length === 0 && isFiltered) continue;
      shown += cards.length;
      navHTML += `<a href="#section-${sec.id}">${sec.label} (${cards.length})</a>`;
      statsHTML += `<div class="stat-item"><div class="stat-num">${cards.length}</div><div class="stat-label">${sec.label}</div></div>`;
      const noteHTML = sec.picks ? `<span class="section-note">过去 7 天精选 · 最多 ${WEEKLY_PICKS_CAP} 条</span>` : '';
      mainHTML += `<section class="section" id="section-${sec.id}">
        <div class="section-header"><h2>${sec.label}</h2><span class="section-count">${cards.length} 条</span>${noteHTML}</div>`;
      if (cards.length === 0) mainHTML += `<div class="empty-section">暂无数据</div>`;
      else mainHTML += `<div class="cards">${cards.map(cardHTML).join('')}</div>`;
      mainHTML += `</section>`;
    }
  }

  if (shown === 0) {
    mainHTML = `<div class="empty-section">${ICONS.inbox}<div>没有匹配的资讯</div></div>`;
  }

  document.getElementById('main-content').innerHTML = mainHTML;
  document.getElementById('nav-inner').innerHTML = navHTML;
  document.getElementById('hero-stats').innerHTML = statsHTML;
  document.getElementById('toolbar-count').textContent =
    `显示 ${shown} 条` + (filter !== 'all' ? ` · 筛选：${filter === 'favorites' ? '收藏' : '未读'}` : '') +
    (searchQuery ? ` · 搜索：${searchQuery}` : '');

  bindCards();
  initScrollSpy();
}

function bindCards() {
  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      const num = parseInt(el.dataset.num, 10);
      const entry = allItems.find(x => x.num === num);
      if (entry) openModal(entry);
    });
  });
  document.querySelectorAll('.card-fav').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const num = parseInt(btn.closest('.card').dataset.num, 10);
      const entry = allItems.find(x => x.num === num);
      if (entry) { toggleFav(entry.key); render(); }
    });
  });
  // 时间线条目：点击展开当日日报概览（阻止直接跳走）
  document.querySelectorAll('.timeline-item').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const row = threadData.find(x => x.date === el.dataset.date);
      if (row) openThreadModal(row);
    });
  });
  // 月报看点：点击平滑定位到该周的脉络分组
  document.querySelectorAll('.hl-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = document.getElementById('week-' + btn.dataset.week);
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ===== Modal =====
function openModal(entry) {
  const item = entry.item;
  const time = fmtTime(getTime(item));
  const source = item.source ? item.source.name : '未知来源';
  const summary = item.summary || '';
  const links = item.links || {};
  const aihotUrl = links.aihot || '';
  const originalUrl = links.original || '';
  const storyMatch = (links.story || '').match(/story\/([a-f0-9-]+)/i);
  const storyPublicId = storyMatch ? storyMatch[1] : null;

  document.getElementById('modal-num').textContent = `序号 ${entry.num}`;
  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-source').textContent = source;
  document.getElementById('modal-time').textContent = time;
  document.getElementById('modal-source-detail').textContent = `来源：${source}`;

  const s = document.getElementById('modal-summary');
  if (summary) {
    s.className = 'modal-summary';
    s.textContent = summary;
  } else if (storyPublicId) {
    s.className = 'modal-summary-loading';
    s.innerHTML = `${ICONS.spinner}<span>正在加载 AIHOT 事件综述...</span>`;
    fetchJSON(`${API_BASE}/stories/${storyPublicId}`).then(d => {
      const story = (d && d.story) || {};
      const latest = story.latest || '';
      const digest = story.digest || '';
      if (!latest && !digest) {
        s.className = 'modal-summary-empty';
        s.textContent = '暂无摘要，请通过下方链接查看原文。';
        return;
      }
      s.className = 'modal-summary';
      s.innerHTML = '';
      if (latest) {
        const latestEl = document.createElement('span');
        latestEl.className = 'modal-context-latest';
        latestEl.innerHTML = `${ICONS.bookmark} 最新：` + latest;
        s.appendChild(latestEl);
      }
      if (digest) {
        const digestEl = document.createElement('span');
        digestEl.textContent = digest;
        s.appendChild(digestEl);
      }
    }).catch(() => {
      s.className = 'modal-summary-empty';
      s.textContent = 'AIHOT 综述加载失败，请通过下方链接查看原文。';
    });
  } else {
    s.className = 'modal-summary-empty';
    s.textContent = '暂无摘要，请通过下方链接查看原文。';
  }

  const cta = document.getElementById('modal-cta');
  const ctaAihot = document.getElementById('modal-cta-aihot');
  ctaAihot.style.display = ''; // 从日报概览弹窗切回时恢复
  if (aihotUrl) { ctaAihot.href = aihotUrl; ctaAihot.classList.remove('disabled'); }
  else { ctaAihot.removeAttribute('href'); ctaAihot.classList.add('disabled'); }

  if (originalUrl) { cta.href = originalUrl; cta.classList.remove('disabled'); cta.textContent = '查看原文 →'; }
  else { cta.removeAttribute('href'); cta.classList.add('disabled'); cta.textContent = '暂无原文'; }

  document.getElementById('modal-backdrop').classList.add('show');
  document.body.classList.add('modal-open');

  if (!isRead(entry.key)) { markRead(entry.key); render(); }
}

// 周报 / 月报时间线：展开某一天的日报概览
function openThreadModal(row) {
  document.getElementById('modal-num').textContent = `日报 ${row.date}`;
  document.getElementById('modal-title').textContent = row.title;
  document.getElementById('modal-source').textContent = 'AIHOT 日报';
  document.getElementById('modal-time').textContent = dateLabel(row.date);
  document.getElementById('modal-source-detail').textContent = `AIHOT 日报 · ${row.date}`;

  const s = document.getElementById('modal-summary');
  s.className = 'modal-summary-loading';
  s.innerHTML = `${ICONS.spinner}<span>正在加载该日日报内容...</span>`;

  const cta = document.getElementById('modal-cta');
  const ctaAihot = document.getElementById('modal-cta-aihot');
  ctaAihot.style.display = 'none'; // 概览弹窗只需一个按钮
  cta.href = row.url;
  cta.classList.remove('disabled');
  cta.textContent = '打开完整日报 →';

  document.getElementById('modal-backdrop').classList.add('show');
  document.body.classList.add('modal-open');

  fetchJSON(`${API_BASE}/dailies/${row.date}`).then(d => {
    const r = (d && d.report) || {};
    const secs = (r.sections || []).filter(x => (x.items || []).length > 0);
    let total = 0;
    for (const x of secs) total += x.items.length;
    if (total === 0) {
      s.className = 'modal-summary-empty';
      s.textContent = '该日日报暂无条目内容，可点击下方按钮打开完整日报。';
      return;
    }
    s.className = 'daily-digest';
    s.innerHTML = secs.map(sec => {
      const itemsHTML = sec.items.map(it => {
        const src = (it.source && it.source.name) || '';
        const sum = it.summary || '';
        const link = (it.links && (it.links.aihot || it.links.original)) || '';
        return `<div class="digest-item">
          <div class="digest-item-title">${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">${it.title}</a>` : it.title}</div>
          ${sum ? `<div class="digest-item-summary">${sum}</div>` : ''}
          ${src ? `<div class="digest-item-source">${src}</div>` : ''}
        </div>`;
      }).join('');
      return `<div class="digest-section">
        <div class="digest-section-title">${sec.label} · ${sec.items.length} 条</div>
        ${itemsHTML}
      </div>`;
    }).join('');
  }).catch(() => {
    s.className = 'modal-summary-empty';
    s.textContent = '加载失败，可点击下方按钮打开完整日报。';
  });
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('show');
  document.body.classList.remove('modal-open');
}

// ===== Data load =====
async function fetchViewData(name) {
  if (name === 'daily') {
    const cats = VIEWS.daily.sections.filter(s => !s.hot);
    const [daily, hot, ...catResults] = await Promise.all([
      fetchJSON(`${API_BASE}/dailies/latest`).catch(() => null),
      fetchJSON(`${API_BASE}/hot-topics`).catch(() => null),
      ...cats.map(s => fetchCategory(s.cat, s.fallback).catch(() => ({ items: [] }))),
    ]);
    return { daily, hot, cats, catResults };
  }
  if (name === 'weekly') {
    const [thread, picks] = await Promise.all([
      fetchJSON(`${API_BASE}/dailies?limit=7`).catch(() => null),
      fetchJSON(`${API_BASE}/items?mode=selected&window=7d&limit=50`).catch(() => null),
    ]);
    return { thread: parseThread(thread), picks: (picks && picks.items) || [] };
  }
  // monthly
  const thread = await fetchJSON(`${API_BASE}/dailies?limit=30`).catch(() => null);
  return { thread: parseThread(thread) };
}

function applyView(name) {
  view = name;
  LS.set(LS_VIEW, view);
  const d = viewData[name];
  const viewDef = VIEWS[name];

  allItems = [];
  threadData = d.thread || [];
  let globalNum = 0;

  if (name === 'daily') {
    if (d.hot && d.hot.items && d.hot.items.length) {
      for (const item of d.hot.items.slice(0, 5)) {
        globalNum++;
        allItems.push({
          item, num: globalNum, key: itemKey(item), sectionId: 'hot',
          rank: item.rank, sourceCount: item.sourceCount, signalCount: item.signalCount,
        });
      }
    }
    const cats = d.cats;
    for (let i = 0; i < cats.length; i++) {
      for (const item of (d.catResults[i].items || [])) {
        globalNum++;
        allItems.push({ item, num: globalNum, key: itemKey(item), sectionId: cats[i].id });
      }
    }
  } else if (name === 'weekly') {
    for (const item of (d.picks || [])) {
      if (globalNum >= WEEKLY_PICKS_CAP) break;
      globalNum++;
      allItems.push({ item, num: globalNum, key: itemKey(item), sectionId: 'w-picks' });
    }
  }
  // monthly 只有时间线，无卡片条目

  // ---- Hero ----
  document.getElementById('hero-title').textContent = viewDef.label;
  document.getElementById('hero-badge').textContent = viewDef.badge;
  document.getElementById('hero-total-label').textContent = viewDef.totalLabel;
  document.title = viewDef.label;

  let dateLine = '';
  if (name === 'daily') {
    const r = (d.daily && d.daily.report) || null;
    if (r && r.windowStart && r.windowEnd) {
      const bj = (utc) => { const t = new Date(utc.getTime() + 8*3600000); return `${t.getUTCFullYear()}年${t.getUTCMonth()+1}月${t.getUTCDate()}日 ${String(t.getUTCHours()).padStart(2,'0')}:00`; };
      dateLine = `${bj(new Date(r.windowStart))} — ${bj(new Date(r.windowEnd))}（北京时间）`;
    } else {
      const bj = new Date(Date.now() + 8*3600000);
      dateLine = `${bj.getUTCFullYear()}年${bj.getUTCMonth()+1}月${bj.getUTCDate()}日（北京时间）`;
    }
  } else {
    const t = threadData;
    if (t.length) {
      const first = t[t.length - 1], last = t[0];
      dateLine = `${first.date} 至 ${last.date} · 共 ${t.length} 天`;
    } else {
      dateLine = '暂无归档数据';
    }
  }

  document.getElementById('hero-date').textContent = dateLine || '数据加载中...';
  document.getElementById('hero-date').classList.remove('loading-text');
  document.getElementById('hero-total').textContent =
    name === 'monthly' ? threadData.length : (name === 'weekly' ? allItems.length : allItems.length);

  // ---- 三个视图卡片的摘要 ----
  const dd = viewData.daily;
  const dr = (dd && dd.daily && dd.daily.report) || null;
  if (dr) {
    let cnt = 0;
    for (const s of (dr.sections || [])) cnt += (s.items || []).length;
    cnt += (dr.flashes || []).length;
    document.getElementById('report-daily-meta').textContent =
      (cnt > 0 ? `${dr.date} · ${cnt} 篇` : `${dr.date}`) + ' · 五版块 + 热点';
  } else {
    document.getElementById('report-daily-meta').textContent = '五版块 + 近期热点';
  }
  const iw = isoWeekBJ();
  document.getElementById('report-weekly-meta').textContent =
    `VOL.${iw.year}-W${String(iw.week).padStart(2, '0')} · 7 天脉络 + 精选`;
  const nowBJ = new Date(Date.now() + 8 * 3600000);
  document.getElementById('report-monthly-meta').textContent =
    `${nowBJ.getUTCFullYear()}年${nowBJ.getUTCMonth()+1}月 · 30 期日报脉络`;

  // ---- 切换器高亮 ----
  document.querySelectorAll('.report-card').forEach(el => {
    el.classList.toggle('active', el.dataset.view === name);
  });

  // ---- Footer ----
  const genTime = fmtTime(new Date().toISOString());
  const dailyUrl = (viewData.daily && viewData.daily.daily && viewData.daily.daily.report &&
    viewData.daily.daily.report.links && viewData.daily.daily.report.links.aihot) || 'https://aihot.virxact.com/daily';
  document.getElementById('footer-inner').innerHTML = `
    <p>当前视图：<strong>${viewDef.label}</strong> · AI 数据：<a href="${dailyUrl}" target="_blank" rel="noopener noreferrer">AIHOT 日报</a> · <a href="https://aihot.virxact.com/weekly" target="_blank" rel="noopener noreferrer">官网周报</a> · <a href="https://aihot.virxact.com/monthly" target="_blank" rel="noopener noreferrer">官网月报</a> · 热点：<a href="https://aihot.virxact.com/hot" target="_blank" rel="noopener noreferrer">AIHOT 热点</a> · 天气：<a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
    <p style="margin-top:6px;font-size:12px">周报／月报由 AIHOT 日报归档的官方每日导语聚合而成 · 页面生成时间：${genTime}（北京时间）· 数据实时拉取，每次刷新即最新</p>
  `;

  render();
}

async function loadView(name, force) {
  if (viewData[name] && !force) { applyView(name); return; }
  document.getElementById('hero-date').textContent = '正在拉取数据...';
  document.getElementById('hero-date').classList.add('loading-text');
  document.getElementById('hero-total').textContent = '—';
  document.getElementById('main-content').innerHTML = '';
  document.getElementById('error-banner').classList.remove('show');
  try {
    viewData[name] = await fetchViewData(name);
    applyView(name);
  } catch (err) {
    handleError(err);
  }
}

// ===== Scroll spy =====
function initScrollSpy() {
  const nav = document.getElementById('nav');
  const links = nav.querySelectorAll('a');
  const sections = [];
  links.forEach(a => {
    const id = a.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) sections.push({ link: a, el });
  });
  function onScroll() {
    if (sections.length === 0) return;
    let current = sections[0];
    const scrollY = window.scrollY + nav.offsetHeight + 20;
    for (const s of sections) { if (s.el.offsetTop <= scrollY) current = s; }
    links.forEach(a => a.classList.remove('active'));
    if (current) current.link.classList.add('active');
  }
  window.removeEventListener('scroll', onScroll);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

// ===== Events =====
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

document.getElementById('reports-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.report-card');
  if (!btn) return;
  const name = btn.dataset.view;
  if (name === view) return;
  loadView(name);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  render();
});

document.getElementById('filter-chips').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-chip');
  if (!btn) return;
  if (btn.id === 'mark-all-read') {
    for (const x of allItems) read.add(x.key);
    LS.set(LS_READ, [...read]);
    render();
    return;
  }
  filter = btn.dataset.filter;
  document.querySelectorAll('.filter-chip[data-filter]').forEach(c => c.classList.toggle('active', c === btn));
  render();
});

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-backdrop')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function handleError(err) {
  const banner = document.getElementById('error-banner');
  banner.textContent = '数据加载失败：' + (err.message || '未知错误') + '。请检查网络后刷新页面重试。';
  banner.classList.add('show');
  document.getElementById('hero-date').textContent = '数据加载失败';
  document.getElementById('hero-date').classList.remove('loading-text');
}

// ===== Init =====
hydrateIcons();
applyTheme();
loadWeather();
loadView(view).catch(handleError);

})();
</script>
