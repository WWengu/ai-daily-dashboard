<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报 · 周报 · 月报</title>
<script>
/* 首次绘制前定好主题，避免深色用户刷新时先闪一帧白底（FOWT）。
   仅读取主脚本写入的值（JSON 字符串，形如 "dark"），不写任何状态。 */
(function () {
  var t = 'light';
  try {
    var raw = localStorage.getItem('ai-daily-theme');
    var stored = null;
    try { stored = raw ? JSON.parse(raw) : null; } catch (e) {}
    if (stored === 'light' || stored === 'dark') {
      t = stored;
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      t = 'dark';
    }
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  /* ============================================================
     Vercel design system
     令牌来源：design-md-library/designs/vercel.md
     中文适配：负字距按 -0.02em 收敛（原规范 -0.05em 针对拉丁字母），
              中文行高上调至 1.7，避免方块字挤压。
     ============================================================ */

  :root {
    /* 让原生 UI（滚动条、表单控件、选中色）跟随主题 */
    color-scheme: light;

    /* Surface ladder */
    --canvas: #ffffff;
    --canvas-soft: #fafafa;
    --canvas-soft-2: #f5f5f5;
    --hairline: #ebebeb;
    --hairline-strong: #a1a1a1;

    /* Ink scale */
    --ink: #171717;
    --body: #4d4d4d;
    /* #888 在白底仅 3.54:1，达不到 4.5:1；#6b6b6b 为 5.33:1 */
    --mute: #6b6b6b;
    --on-primary: #ffffff;

    /* Semantic */
    --link: #0070f3;
    --link-deep: #0761d1;
    --error: #ee0000;
    --warning: #f5a623;

    /* Radius — 6 for controls, 8 for cards */
    --r-xs: 4px;
    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-pill: 100px;
    --r-full: 9999px;

    /* Elevation — stacked offsets + inset hairline ring */
    --e1: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    --e2: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 1px 1px rgba(0, 0, 0, 0.02), 0 2px 2px rgba(0, 0, 0, 0.04);
    --e3: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 2px 2px rgba(0, 0, 0, 0.04), 0 8px 8px -8px rgba(0, 0, 0, 0.04);
    --e5: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 1px 1px rgba(0, 0, 0, 0.02), 0 8px 16px -4px rgba(0, 0, 0, 0.04), 0 24px 32px -8px rgba(0, 0, 0, 0.06);

    /* Spacing — 4px base */
    --s-xs: 8px;
    --s-sm: 12px;
    --s-md: 16px;
    --s-lg: 24px;
    --s-xl: 32px;
    --s-2xl: 40px;
    --s-3xl: 48px;
    --s-4xl: 64px;

    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

    --dur: 150ms;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  [data-theme="dark"] {
    color-scheme: dark;

    /* 层级必须正向：页面最暗 < 卡片 < 内嵌块 */
    --canvas: #111111;
    --canvas-soft: #000000;
    --canvas-soft-2: #1c1c1c;
    --hairline: #333333;
    --hairline-strong: #666666;

    --ink: #ededed;
    --body: #a1a1a1;
    --mute: #888888;
    --on-primary: #000000;

    --link: #3291ff;
    --link-deep: #0070f3;

    --e1: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    --e2: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 1px 1px rgba(0, 0, 0, 0.4), 0 2px 2px rgba(0, 0, 0, 0.4);
    --e3: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 2px 2px rgba(0, 0, 0, 0.4), 0 8px 8px -8px rgba(0, 0, 0, 0.5);
    --e5: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 8px 16px -4px rgba(0, 0, 0, 0.6), 0 24px 32px -8px rgba(0, 0, 0, 0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 120px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: var(--font-sans);
    background: var(--canvas-soft);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }

  body.modal-open { overflow: hidden; }

  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    border-radius: var(--r-xs);
  }

  .icon {
    width: 1em;
    height: 1em;
    display: inline-block;
    vertical-align: -0.14em;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 控件不参与文本选择：Windows 下点击/双击控件会选中其文字，
     视觉上像变成了输入框。纯展示内容（标题、日期、摘要）保持可选中。 */
  .theme-toggle,
  .report-card,
  .city-trigger,
  .city-option,
  .filter-chip,
  .card-fav,
  .modal-close,
  .modal-cta,
  .nav a {
    -webkit-user-select: none;
    user-select: none;
  }

  .icon-lg { width: 1.25em; height: 1.25em; }
  .icon-xl { width: 1.6em; height: 1.6em; }
  .icon-solid { fill: currentColor; stroke: none; }

  /* ===== Hero — 左对齐，标题区与天气卡两栏 ===== */
  .hero {
    position: relative;
    background: var(--canvas);
    border-bottom: 1px solid var(--hairline);
    padding: var(--s-4xl) var(--s-lg) var(--s-3xl);
    overflow: hidden;
  }

  /* hero 保持纯白：数据看板不用营销页的 mesh 渐变 */

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    text-align: left;
  }

  /* 左：标题 / 日期 / 总数；右：天气卡 */
  .hero-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: var(--s-2xl);
    /* 拉伸而非顶对齐：天气卡高度与左栏一致，右边缘不留参差空白 */
    align-items: stretch;
  }

  .hero-lead {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .hero-count {
    display: flex;
    align-items: baseline;
    gap: 8px;
    /* 沉到左栏底部，与天气卡下缘齐平；padding-top 保证最小间距 */
    margin-top: auto;
    padding-top: 18px;
  }

  /* 数据来源并入标题下方的信息行，不再作为标题上方的小标签 */
  .hero-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .hero-source {
    font-size: 12px;
    color: var(--mute);
    font-family: var(--font-mono);
  }
  .hero-source::before { content: '·'; margin-right: 8px; }

  .hero h1 {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .hero .date-range {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.7;
    letter-spacing: 0;
    color: var(--body);
    margin-bottom: 0;
    font-variant-numeric: tabular-nums;
  }

  .hero .date-range.loading-text {
    font-size: 15px;
    color: var(--mute);
  }

  .theme-toggle {
    /* 固定在视口，滚动时始终可点；滚动到顶部时视觉位置与原来一致 */
    position: fixed;
    top: 18px;
    right: 18px;
    width: 34px;
    height: 34px;
    border-radius: var(--r-sm);
    border: 1px solid var(--hairline);
    background: var(--canvas);
    color: var(--body);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 高于吸顶导航(100)、低于弹窗(1000) */
    z-index: 150;
    box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.08);
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
      border-color var(--dur) var(--ease);
  }
  .theme-toggle:hover { background: var(--canvas-soft-2); color: var(--ink); border-color: var(--hairline-strong); }

  /* 两个图标叠放：淡入淡出 + 旋转缩放交换，取代瞬间替换 innerHTML */
  .tt-icon {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  /* 默认即浅色态：月亮在场，太阳缩到背后 */
  .tt-moon { opacity: 1; transform: rotate(0deg) scale(1); }
  .tt-sun { opacity: 0; transform: rotate(-115deg) scale(0.6); }

  .theme-toggle[data-state="dark"] .tt-moon { opacity: 0; transform: rotate(115deg) scale(0.6); }
  .theme-toggle[data-state="dark"] .tt-sun { opacity: 1; transform: rotate(0deg) scale(1); }

  /* 初始化完成后再启用过渡，避免首帧就播一遍。
     时长偏长是有意的：图标在扩散过半（~340ms）就启动，但那之后仍在
     快照遮盖下，只有揭开（680ms）后的尾段可见——时长不够就会看着像瞬间跳变。 */
  .theme-toggle.tt-ready .tt-icon {
    transition: opacity 500ms var(--ease),
      transform 620ms cubic-bezier(0.34, 1.28, 0.64, 1);
  }

  /* ===== Weather ===== */
  .weather {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    box-shadow: var(--e2);
    padding: 18px 20px;
    text-align: left;
  }

  .weather-loading {
    font-size: 13px;
    color: var(--mute);
    text-align: center;
    padding: 8px;
    font-family: var(--font-mono);
  }

  .weather-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-sm);
    margin-bottom: 14px;
  }

  .weather-city {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 自绘城市下拉：原生 select 展开后的列表由系统绘制，颜色与形态都无法跟随
     页面主题（深色模式下会弹出系统样式），因此整体自己实现。 */
  .city-picker { position: relative; }

  .city-trigger {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 26px;
    padding: 0 8px 0 10px;
    border: 1px solid var(--hairline);
    border-radius: var(--r-sm);
    background: var(--canvas);
    color: var(--ink);
    font-size: 12px;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .city-trigger:hover { border-color: var(--hairline-strong); }
  .city-trigger[aria-expanded="true"] { border-color: var(--ink); }
  .city-trigger:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .city-chevron {
    width: 6px;
    height: 6px;
    margin-top: -3px;
    border-right: 1.5px solid var(--mute);
    border-bottom: 1.5px solid var(--mute);
    transform: rotate(45deg);
    transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .city-trigger:hover .city-chevron { border-color: var(--ink); }
  /* 展开时箭头翻转向上，作为状态反馈 */
  .city-trigger[aria-expanded="true"] .city-chevron {
    margin-top: 3px;
    transform: rotate(225deg);
    border-color: var(--ink);
  }

  .city-menu {
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    z-index: 60;
    min-width: 104px;
    max-height: 264px;
    overflow-y: auto;
    overscroll-behavior: contain;
    margin: 0;
    padding: 4px;
    list-style: none;
    background: var(--canvas);
    border-radius: var(--r-md);
    box-shadow: var(--e5);
  }
  .city-menu[hidden] { display: none; }

  .city-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 10px;
    border-radius: var(--r-xs);
    font-size: 12px;
    font-weight: 400;
    color: var(--body);
    cursor: pointer;
    white-space: nowrap;
    outline: none;
  }
  .city-option.is-active { background: var(--canvas-soft-2); color: var(--ink); }
  .city-option.is-selected { color: var(--ink); font-weight: 500; }
  /* 勾选用两条边框绘制，避免引入字形图标 */
  .city-option.is-selected::after {
    content: '';
    width: 7px;
    height: 4px;
    border-left: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg) translate(1px, -1px);
  }

  .weather-update {
    font-size: 11px;
    color: var(--mute);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .weather-now {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .weather-icon {
    width: 44px;
    height: 44px;
    stroke: var(--ink);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .weather-temp {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .weather-desc {
    font-size: 13px;
    color: var(--body);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .weather-meta {
    font-size: 12px;
    color: var(--mute);
    line-height: 1.8;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .hero .total {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .hero .total-label {
    font-size: 13px;
    letter-spacing: 0;
    color: var(--mute);
  }

  .stats-bar {
    display: flex;
    justify-content: flex-start;
    flex-wrap: wrap;
    margin-top: var(--s-2xl);
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: var(--s-md) 0;
  }

  .stat-item {
    padding: 0 var(--s-lg);
    text-align: left;
    border-left: 1px solid var(--hairline);
  }
  .stat-item:first-child { border-left: none; padding-left: 0; }

  .stat-item .stat-num {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .stat-item .stat-label {
    font-size: 12px;
    letter-spacing: 0;
    color: var(--mute);
    margin-top: 2px;
    white-space: nowrap;
  }

  /* ===== Views (3 cards) ===== */
  .reports {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--s-xl) var(--s-lg) 0;
  }

  .reports-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--s-md);
  }

  .report-card {
    background: var(--canvas);
    border-radius: var(--r-md);
    box-shadow: var(--e2);
    padding: var(--s-lg);
    color: inherit;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    width: 100%;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .report-card:hover { box-shadow: var(--e3); }
  .report-card.active {
    box-shadow: inset 0 0 0 1px var(--ink), 0 1px 1px rgba(0, 0, 0, 0.02), 0 2px 2px rgba(0, 0, 0, 0.04);
  }

  .report-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--r-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    background: var(--canvas-soft-2);
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .report-icon svg { width: 18px; height: 18px; }
  .report-card.active .report-icon { background: var(--ink); color: var(--canvas); }

  .report-body { flex: 1; min-width: 0; }

  .report-type {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--mute);
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .report-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    margin: 4px 0 3px;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .report-meta {
    font-size: 12px;
    color: var(--body);
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }

  /* ===== Nav + toolbar ===== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: color-mix(in srgb, var(--canvas) 88%, transparent);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--hairline);
    margin-top: var(--s-xl);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 2px;
    /* 右侧留出悬浮主题按钮的宽度，避免导航项滑到按钮下方 */
    padding: 0 64px 0 var(--s-lg);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display: none; }

  .nav a {
    display: block;
    padding: 9px 14px;
    margin: 8px 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--body);
    text-decoration: none;
    white-space: nowrap;
    border-radius: var(--r-full);
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav a:hover { color: var(--ink); background: var(--canvas-soft-2); }
  .nav a.active { color: var(--ink); background: var(--canvas-soft-2); }

  .toolbar {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    gap: var(--s-sm);
    flex-wrap: wrap;
    padding: var(--s-sm) var(--s-lg);
    border-top: 1px solid var(--hairline);
  }

  .search-input {
    flex: 1;
    min-width: 180px;
    max-width: 320px;
    height: 36px;
    padding: 0 12px;
    border-radius: var(--r-sm);
    border: 1px solid var(--hairline);
    background: var(--canvas);
    color: var(--ink);
    font-size: 13px;
    font-family: var(--font-sans);
    outline: none;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .search-input::placeholder { color: var(--mute); }
  .search-input:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent);
  }

  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    color: var(--body);
    height: 30px;
    padding: 0 12px;
    border-radius: var(--r-full);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all var(--dur) var(--ease);
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--hairline-strong); color: var(--ink); }
  .filter-chip.active {
    background: var(--ink);
    color: var(--canvas);
    border-color: var(--ink);
  }
  .filter-chip .icon { width: 12px; height: 12px; }

  .toolbar-count {
    font-size: 12px;
    color: var(--mute);
    margin-left: auto;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  /* ===== Main ===== */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--s-2xl) var(--s-lg) var(--s-4xl);
  }

  .section { margin-bottom: var(--s-3xl); }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: var(--s-sm);
    margin-bottom: var(--s-md);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--hairline);
  }

  .section-header h2 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--ink);
  }

  .section-header .section-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--mute);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }

  .section-header .section-note {
    font-size: 12px;
    color: var(--mute);
    margin-left: auto;
    font-weight: 400;
    text-align: right;
    line-height: 1.6;
  }
  .section-header .section-note a { color: var(--link); }
  .section-header .section-note a:hover { text-decoration: underline; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: var(--s-md);
  }

  /* ===== Card ===== */
  .card {
    background: var(--canvas);
    border-radius: var(--r-md);
    box-shadow: var(--e2);
    padding: 20px;
    position: relative;
    cursor: pointer;
    transition: box-shadow var(--dur) var(--ease), opacity var(--dur) var(--ease);
  }
  .card:hover { box-shadow: var(--e3); }

  /* 已读：用底色与描边降权，不用整卡 opacity（那会把摘要压到 2.71:1） */
  .card.read {
    background: var(--canvas-soft);
    box-shadow: inset 0 0 0 1px var(--hairline);
  }
  .card.read:hover { box-shadow: var(--e2); }
  .card.read .card-title { color: var(--body); font-weight: 400; }

  .card.fav { box-shadow: inset 0 0 0 1px var(--ink), 0 1px 1px rgba(0, 0, 0, 0.02), 0 2px 2px rgba(0, 0, 0, 0.04); }

  .card-num {
    position: absolute;
    top: 14px;
    left: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--mute);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }

  .card-fav {
    position: absolute;
    top: 10px;
    right: 10px;
    background: transparent;
    border: none;
    width: 26px;
    height: 26px;
    border-radius: var(--r-xs);
    cursor: pointer;
    color: var(--mute);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .card-fav:hover { color: var(--ink); background: var(--canvas-soft-2); }
  .card-fav.on { color: var(--ink); }
  .card-fav .icon { width: 16px; height: 16px; }

  .card-title {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.65;
    margin-bottom: 8px;
    margin-top: 18px;
    color: var(--ink);
    padding-right: 24px;
    letter-spacing: 0;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .card-chip {
    display: inline-block;
    background: var(--canvas-soft-2);
    color: var(--body);
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: var(--r-full);
    font-family: var(--font-sans);
  }

  .card-time {
    font-size: 11px;
    color: var(--mute);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .card-summary {
    font-size: 13px;
    color: var(--body);
    line-height: 1.75;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-hotline {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 500;
    color: var(--body);
    margin: 0 0 8px;
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }
  .card-hotline .icon { width: 12px; height: 12px; }

  .card-tap-hint {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink);
    font-weight: 500;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .card:hover .card-tap-hint { opacity: 1; transform: translateY(0); }

  /* ===== Timeline ===== */
  .timeline {
    position: relative;
    padding-left: 26px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 5px;
    top: 14px;
    bottom: 14px;
    width: 1px;
    background: var(--hairline);
  }

  .timeline-item {
    position: relative;
    display: block;
    padding: 16px 18px;
    background: var(--canvas);
    border-radius: var(--r-md);
    box-shadow: var(--e2);
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
    transition: box-shadow var(--dur) var(--ease);
  }
  .timeline-item:hover { box-shadow: var(--e3); }
  .timeline-item:hover .timeline-hint { opacity: 1; }

  .timeline-item::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 22px;
    width: 7px;
    height: 7px;
    border-radius: 1px;
    background: var(--hairline-strong);
  }
  .timeline-item:hover::before { background: var(--ink); }

  .timeline-date {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--mute);
    font-weight: 400;
    margin-bottom: 5px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }

  .timeline-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.7;
  }

  .timeline-hint {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--body);
    font-weight: 500;
    opacity: 0;
    transition: opacity var(--dur) var(--ease);
  }
  .timeline-hint .icon { width: 12px; height: 12px; }

  .timeline-group-title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--mute);
    margin: 26px 0 12px;
    padding-left: 2px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    scroll-margin-top: 128px;
    font-variant-numeric: tabular-nums;
  }
  .timeline-group-title:first-child { margin-top: 0; }

  /* ===== Monthly ===== */
  .m-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--s-sm);
    margin-bottom: var(--s-lg);
  }

  .m-stat {
    background: var(--canvas);
    border-radius: var(--r-md);
    box-shadow: var(--e2);
    padding: var(--s-lg) var(--s-md);
    text-align: center;
  }

  .m-stat-num {
    font-size: 30px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .m-stat-label {
    font-size: 12px;
    color: var(--mute);
    margin-top: 4px;
    letter-spacing: 0;
  }

  .hl-list { display: flex; flex-direction: column; gap: 8px; }

  .hl-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: var(--canvas);
    border-radius: var(--r-md);
    box-shadow: var(--e2);
    padding: 16px 18px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    width: 100%;
    color: inherit;
    transition: box-shadow var(--dur) var(--ease);
  }
  .hl-item:hover { box-shadow: var(--e3); }

  .hl-num {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 400;
    color: var(--mute);
    width: 26px;
    flex-shrink: 0;
    padding-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .hl-body { flex: 1; min-width: 0; }

  .hl-week {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--mute);
    font-weight: 400;
    margin-bottom: 4px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  .hl-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.65;
  }

  .hl-meta {
    font-size: 11px;
    color: var(--mute);
    margin-top: 4px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  /* ===== Digest ===== */
  .daily-digest { font-size: 14px; }

  .digest-section { margin-bottom: 22px; }
  .digest-section:last-child { margin-bottom: 0; }

  .digest-section-title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--mute);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  .digest-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--hairline);
  }
  .digest-item:last-child { border-bottom: none; padding-bottom: 2px; }

  .digest-item-title {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.65;
    color: var(--ink);
    margin-bottom: 5px;
  }
  .digest-item-title a { color: inherit; }
  .digest-item-title a:hover { color: var(--ink); text-decoration: underline; }

  .digest-item-summary {
    font-size: 13px;
    line-height: 1.75;
    color: var(--body);
  }

  .digest-item-source {
    font-size: 11px;
    color: var(--mute);
    margin-top: 5px;
    font-family: var(--font-mono);
  }

  /* ===== Empty ===== */
  .empty-section {
    padding: 36px 24px;
    text-align: center;
    color: var(--mute);
    font-size: 13px;
    background: var(--canvas);
    border-radius: var(--r-md);
    box-shadow: var(--e1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .empty-section .icon {
    width: 26px;
    height: 26px;
    stroke: var(--hairline-strong);
  }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--s-lg);
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) var(--ease);
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--canvas);
    border-radius: var(--r-lg);
    box-shadow: var(--e5);
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    gap: var(--s-md);
    padding: 22px 24px;
    border-bottom: 1px solid var(--hairline);
  }

  .modal-header-content { flex: 1; min-width: 0; }

  .modal-num {
    display: inline-block;
    background: var(--canvas-soft-2);
    color: var(--body);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 400;
    padding: 2px 8px;
    border-radius: var(--r-full);
    margin-bottom: 10px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }

  .modal-title {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .modal-meta {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--mute);
    font-variant-numeric: tabular-nums;
  }

  .modal-close {
    background: transparent;
    border: 1px solid var(--hairline);
    width: 30px;
    height: 30px;
    border-radius: var(--r-sm);
    cursor: pointer;
    color: var(--body);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .modal-close:hover { background: var(--canvas-soft-2); color: var(--ink); }
  .modal-close .icon { width: 14px; height: 14px; }

  .modal-body {
    padding: 22px 24px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-summary {
    font-size: 14px;
    line-height: 1.85;
    color: var(--body);
    white-space: pre-wrap;
    word-wrap: break-word;
    background: var(--canvas-soft);
    border-radius: var(--r-md);
    padding: 16px 18px;
    box-shadow: var(--e1);
  }

  .modal-summary-loading {
    font-size: 13px;
    color: var(--mute);
    background: var(--canvas-soft);
    border-radius: var(--r-md);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 9px;
    line-height: 1.7;
    white-space: pre-wrap;
    font-family: var(--font-mono);
  }
  .modal-summary-loading .icon {
    width: 14px;
    height: 14px;
    color: var(--mute);
    animation: spin 1s linear infinite;
    flex-shrink: 0;
  }

  .modal-summary-empty {
    font-size: 13px;
    color: var(--mute);
    padding: 8px 2px;
    line-height: 1.7;
  }

  .modal-context-latest {
    display: block;
    color: var(--ink);
    font-weight: 500;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--hairline);
    line-height: 1.7;
  }
  .modal-context-latest .icon {
    width: 13px;
    height: 13px;
    color: var(--mute);
    margin-right: 4px;
    vertical-align: -0.12em;
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-sm);
    flex-wrap: wrap;
  }

  .modal-source {
    font-size: 11px;
    color: var(--mute);
    font-family: var(--font-mono);
  }

  .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .modal-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 16px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid transparent;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
      border-color var(--dur) var(--ease);
  }
  .modal-cta .icon { width: 13px; height: 13px; }
  .modal-cta:hover { text-decoration: none; }

  .modal-cta:not(.secondary) {
    background: var(--ink);
    color: var(--canvas);
    border-color: var(--ink);
  }
  .modal-cta:not(.secondary):hover {
    background: color-mix(in srgb, var(--ink) 84%, var(--canvas));
  }

  .modal-cta.secondary {
    background: var(--canvas);
    color: var(--ink);
    border-color: var(--hairline);
  }
  .modal-cta.secondary:hover {
    border-color: var(--hairline-strong);
    background: var(--canvas-soft-2);
  }

  .modal-cta.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* ===== Footer — polarity-flipped dark band ===== */
  .footer {
    background: var(--ink);
    color: var(--canvas);
  }

  .footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--s-3xl) var(--s-lg);
    font-size: 12px;
    line-height: 1.9;
    text-align: center;
    font-family: var(--font-mono);
  }
  .footer-inner strong { color: var(--canvas); font-weight: 500; }
  .footer-inner a { color: var(--canvas); text-decoration: underline; text-underline-offset: 2px; }
  .footer-inner a:hover { opacity: 0.8; }

  /* ===== Error banner ===== */
  .error-banner {
    max-width: 1200px;
    margin: var(--s-md) auto 0;
    padding: 12px 16px;
    background: var(--canvas);
    border-radius: var(--r-md);
    box-shadow: inset 0 0 0 1px rgba(238, 0, 0, 0.35);
    color: var(--body);
    font-size: 13px;
    line-height: 1.7;
    display: none;
  }
  .error-banner.show { display: block; }
  .error-banner strong { color: var(--error); font-weight: 500; }

  /* ===== Theme transition (circular reveal) ===== */
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation: none;
    mix-blend-mode: normal;
  }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) {
    z-index: 2;
    will-change: clip-path;
    transform: translateZ(0);
    backface-visibility: hidden;
  }

  /* 注意：不要在转场期间关掉导航的 backdrop-filter。
     视图转场时页面被冻结为快照，毛玻璃只在捕获时渲染一次，并无逐帧开销；
     若此刻禁用，新快照里的导航会失去模糊，88% 半透明底会把后面的字透出来。 */
  html:active-view-transition body {
    transition: none;
  }

  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root),
    ::view-transition-new(root) { animation: none !important; }
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card, .report-card, .timeline-item, .hl-item,
    .card-tap-hint, .timeline-hint, .modal-summary-loading .icon {
      transition: none !important;
      animation: none !important;
      transform: none !important;
    }
  }

  /* ===== Responsive ===== */
  @media (max-width: 960px) {
    .reports-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 768px) {
    .hero { padding: var(--s-3xl) var(--s-md) var(--s-xl); }
    /* 窄屏单栏：天气卡落到标题下方 */
    .hero-main { grid-template-columns: 1fr; gap: var(--s-lg); }
    .hero h1 { font-size: 34px; letter-spacing: -0.02em; }
    .hero .total { font-size: 26px; }
    .hero .date-range { font-size: 15px; }
    /* 换行时改用间距分隔：避免第二行首项因左内距而缩进，也避免竖线出现在行首 */
    .stats-bar { margin-top: var(--s-xl); gap: var(--s-lg); row-gap: var(--s-md); }
    .stat-item { padding: 0; border-left: none; }
    .reports { padding: var(--s-lg) var(--s-md) 0; }
    /* 移动端关闭毛玻璃：滚动时每帧重新合成，是主要卡顿源 */
    .nav {
      margin-top: var(--s-lg);
      background: var(--canvas);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .nav-inner { padding: 0 var(--s-md); }
    .main { padding: var(--s-xl) var(--s-md) var(--s-3xl); }
    .section { margin-bottom: var(--s-2xl); }
    .cards { grid-template-columns: 1fr; }
    .section-header { flex-wrap: wrap; gap: 6px; }
    .section-header .section-note { margin-left: 0; width: 100%; text-align: left; }
    .toolbar { padding: var(--s-sm) var(--s-md); }
    .search-input { max-width: none; }
    .weather { padding: 15px 16px; }
    .weather-now { gap: 14px; }
    .weather-icon { width: 36px; height: 36px; }
    .weather-temp { font-size: 32px; }
    .timeline { padding-left: 20px; }
    .timeline-item::before { left: -18px; }
    .m-stats { gap: 8px; }
    .m-stat { padding: 18px 10px; }
    .m-stat-num { font-size: 24px; }
    .hl-item { gap: 12px; padding: 14px; }
  }

  @media (max-width: 480px) {
    .hero { padding: 36px 14px 22px; }
    .hero h1 { font-size: 28px; }
    .hero .total { font-size: 24px; }
    .stats-bar { padding: var(--s-sm) 0; }
    .stat-item .stat-num { font-size: 17px; }
    .stat-item .stat-label { font-size: 11px; }
    .card { padding: 16px; }
    .card-num { top: 12px; left: 16px; }
    .modal-backdrop { padding: 12px; }
    .modal-header, .modal-body, .modal-footer { padding-left: 16px; padding-right: 16px; }
    .modal-title { font-size: 17px; }
    .timeline { padding-left: 16px; }
    .timeline-item::before { left: -14px; }
    .m-stats { grid-template-columns: 1fr; }
    .filter-chips { width: 100%; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
    .filter-chips::-webkit-scrollbar { display: none; }
    .toolbar-count { width: 100%; margin-left: 0; }
    .footer-inner { padding: var(--s-xl) var(--s-md); }
  }
</style>
</head>
<body>

<!-- Hero -->
<div class="hero">

function isRead(k) { return read.has(k); }

function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
}

// 图标状态单独同步：转场期间保持旧图标（与静态快照一致，交接不跳变），
// 转场结束后再切换，动画才看得见。
function syncIcon() {
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.setAttribute('data-state', theme);
}
let themeSwitching = false;

function toggleTheme() {
  const next = theme === 'light' ? 'dark' : 'light';

  // 主题状态变更（与改造前完全一致，不做任何改动）
  const commit = () => {
    theme = next;
    LS.set(LS_THEME, theme);
    applyTheme();
  };

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 不支持 View Transitions / 用户偏好减少动效 / 上一次转场未结束 → 直接切换
  if (!document.startViewTransition || reduceMotion || themeSwitching) {
    commit();
    syncIcon();
    return;
  }

  // 扩散原点：切换按钮的几何中心（用 rect 而非事件坐标，键盘触发同样有正确原点）
  const btn = document.getElementById('theme-toggle');
  const rect = btn ? btn.getBoundingClientRect() : null;
  const ox = rect ? rect.left + rect.width / 2 : window.innerWidth - 37;
  const oy = rect ? rect.top + rect.height / 2 : 37;
  // 半径取到最远角的距离，确保圆能盖满整个视口
  const radius = Math.hypot(
    Math.max(ox, window.innerWidth - ox),
    Math.max(oy, window.innerHeight - oy)
  );

  const REVEAL_MS = 680;
  themeSwitching = true;
  try {
    const vt = document.startViewTransition(commit);
    vt.ready.then(() => {
      document.documentElement.animate(
        {
          clipPath: [
            `circle(0px at ${ox}px ${oy}px)`,
            `circle(${radius}px at ${ox}px ${oy}px)`,
          ],
        },
        {
          // 时长放慢、曲线回到两端平缓的分布：
          // 扩散边界匀速可追踪，比快起慢收更"顺"（后者只是显快）
          duration: REVEAL_MS,
          easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
          pseudoElement: '::view-transition-new(root)',
        }
      );
      // 扩散过半就开始换图标，不必等整页铺满。
      // 此刻按钮仍在快照遮盖下、前半段不可见，但与图标过渡时长配合后，
      // 快照揭开时正处在中段，衔接自然。
      setTimeout(syncIcon, Math.round(REVEAL_MS / 2));
    }).catch(() => {});
    // 兜底：转场异常或提前结束时保证图标最终正确（重复设置是幂等的）
    vt.finished.catch(() => {}).finally(() => { syncIcon(); themeSwitching = false; });
  } catch (e) {
    themeSwitching = false;
    commit();
    syncIcon();
  }
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8 * 3600000);
  return `${bj.getUTCFullYear()}年${bj.getUTCMonth()+1}月${bj.getUTCDate()}日 ` +
    `${String(bj.getUTCHours()).padStart(2,'0')}:${String(bj.getUTCMinutes()).padStart(2,'0')}`;
}
function getTime(entry) { return entry.latestAt || entry.publishedAt || entry.discoveredAt; }

const WD = ['周日','周一','周二','周三','周四','周五','周六'];
// "2026-09-09" -> "09-09 周三"
function dateLabel(dateStr) {
  const p = String(dateStr).split('-').map(Number);
  if (p.length < 3 || isNaN(p[0])) return dateStr;
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  return `${String(p[1]).padStart(2,'0')}-${String(p[2]).padStart(2,'0')} ${WD[d.getUTCDay()]}`;
}
// ISO 周序号（按 UTC 日期算，日期串固定无时区歧义）
function isoWeekOf(dateStr) {
  const p = String(dateStr).split('-').map(Number);
  const t = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  const dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  return { year: t.getUTCFullYear(), week: week };
}
// 当前北京时间的 ISO 周序号（用于周报卡片标签）
function isoWeekBJ() {
  const d = new Date(Date.now() + 8 * 3600000);
  return isoWeekOf(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);
}

function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.slice(0, max).replace(/\s+$/,'') + '...' : str;
}

  // AIHOT 的 Access-Control-Allow-Headers 不含 user-agent，预检会被拒。
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
  return resp.json();
}

// ===== 数据源健康度 =====
// 接口失败都被 .catch 吞掉了，页面看起来只是"今天没数据"。
// 这里记录失败次数：全部失败时给出可见提示，避免把"接口挂了"误读成"没新闻"。
let srcAttempts = 0;
let srcFailures = 0;

function trackFetch(promise) {
  srcAttempts++;
  return promise.catch(() => { srcFailures++; return null; });
}

function resetSourceHealth() { srcAttempts = 0; srcFailures = 0; }

function checkSourceHealth() {
  const banner = document.getElementById('error-banner');
  if (!banner) return;
  if (srcAttempts > 0 && srcFailures === srcAttempts) {
    banner.innerHTML =
      '<strong>数据源暂时不可用</strong> · AIHOT 接口可能已变更或网络异常，下方内容为空。天气数据不受影响。 ' +
      '<a href="#" onclick="location.reload();return false;" style="color:var(--accent);font-weight:500">刷新重试</a>';
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

// ===== Weather =====
function getSavedCity() {
  try { const s = localStorage.getItem(LS_KEY_CITY); if (s && CITIES[s]) return s; } catch(e) {}
  return DEFAULT_CITY;
}
function saveCity(city) { try { localStorage.setItem(LS_KEY_CITY, city); } catch(e) {} }

// 自绘城市下拉的交互：开关、键盘、焦点还原、点击外部关闭。
// 原生 select 的弹层由系统绘制，无法跟随主题，所以列表也得自己画。
function bindCityPicker() {
  const picker = document.querySelector('.city-picker');
  if (!picker) return;
  const trigger = picker.querySelector('.city-trigger');
  const menu = picker.querySelector('.city-menu');
  const options = Array.from(menu.querySelectorAll('.city-option'));
  if (!trigger || !menu || options.length === 0) return;

  let active = Math.max(0, options.findIndex(o => o.getAttribute('aria-selected') === 'true'));

  function highlight(i) {
    active = Math.max(0, Math.min(i, options.length - 1));
    options.forEach((o, k) => o.classList.toggle('is-active', k === active));
  }
  function open() {
    menu.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
    highlight(active);
    options[active].focus();
    options[active].scrollIntoView({ block: 'nearest' });
  }
  function close(returnFocus) {
    if (menu.hidden) return;
    menu.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    if (returnFocus) trigger.focus();
  }
  function choose(i) {
    const name = options[i] && options[i].dataset.city;
    if (!name) return;
    saveCity(name);
    // 注意：loadWeather 会重建整块天气 DOM，旧 trigger 会被销毁，
    // 所以不能先 close(true) 再渲染 —— 焦点要落在重建后的新节点上。
    menu.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    loadWeather();
    const fresh = document.getElementById('city-trigger');
    if (fresh) fresh.focus();
  }

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    if (menu.hidden) open(); else close(false);
  });
  trigger.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); open(); }
  });

  options.forEach((opt, i) => {
    opt.addEventListener('click', (e) => { e.stopPropagation(); choose(i); });
    opt.addEventListener('mouseenter', () => highlight(i));
  });

  menu.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault(); highlight(active + 1);
      options[active].focus(); options[active].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault(); highlight(active - 1);
      options[active].focus(); options[active].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Home') {
      e.preventDefault(); highlight(0); options[active].focus();
    } else if (e.key === 'End') {
      e.preventDefault(); highlight(options.length - 1); options[active].focus();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault(); choose(active);
    } else if (e.key === 'Escape') {
      e.preventDefault(); close(true);
    } else if (e.key === 'Tab') {
      close(false);
    }
  });
}

async function loadWeather() {
  const weatherEl = document.getElementById('weather');
  const city = getSavedCity();
  const cityOptions = Object.keys(CITIES).map(name => {
    const sel = name === city;
    return `<li role="option" tabindex="-1" data-city="${name}" `
      + `class="city-option${sel ? ' is-selected' : ''}" aria-selected="${sel}">${name}</li>`;
  }).join('');
  weatherEl.innerHTML = `
    <div class="weather-head">
      <div class="weather-city">
        <span class="icon" data-icon="pin" style="width:15px;height:15px"></span>
        <div class="city-picker">
          <button type="button" class="city-trigger" id="city-trigger"
                  aria-haspopup="listbox" aria-expanded="false" aria-controls="city-menu">
            <span>${city}</span>
            <span class="city-chevron" aria-hidden="true"></span>
          </button>
          <ul class="city-menu" id="city-menu" role="listbox" aria-label="选择城市" hidden>${cityOptions}</ul>
        </div>
      </div>
      <div class="weather-update" id="weather-update"></div>
    </div>
    <div id="weather-body"><div class="weather-loading">正在加载天气...</div></div>
  `;
  hydrateIcons(weatherEl);
  bindCityPicker();

  const { lat, lon } = CITIES[city];
  // 必须带 timezone：否则接口返回 UTC，而 "2026-11-08T17:00" 这种无时区后缀的
  // 字符串会被 JS 当成本地时间解析，最终把 UTC 时间当北京时间显示（差 8 小时）。
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m&forecast_days=1&timezone=Asia%2FShanghai`;
  try {
    const data = await fetchJSON(url);
    const cur = data.current || {};
    const [icon, desc] = weatherInfo(cur.weather_code);
    const temp = Math.round(cur.temperature_2m);
    const feels = Math.round(cur.apparent_temperature);
    const humidity = cur.relative_humidity_2m;
    const wind = Math.round(cur.wind_speed_10m);
    document.getElementById('weather-body').innerHTML = `
      <div class="weather-now">
        <div class="weather-icon">${icon}</div>
        <div style="flex:1;min-width:0">
          <div class="weather-temp">${temp}°C</div>
          <div class="weather-desc">${desc} · 体感 ${feels}°C</div>
          <div class="weather-meta">湿度 ${humidity}% · 风速 ${wind} km/h</div>
        </div>
      </div>`;
    // 接口已按 Asia/Shanghai 返回本地时间，直接用本地方法读取，不要再手动加 8 小时
    const u = cur.time ? new Date(cur.time) : new Date();
    document.getElementById('weather-update').textContent =
      `更新于 ${u.getMonth()+1}/${u.getDate()} ${String(u.getHours()).padStart(2,'0')}:${String(u.getMinutes()).padStart(2,'0')}`;
  } catch (err) {
    document.getElementById('weather-body').innerHTML = `<div class="weather-loading">天气加载失败：${err.message || '未知错误'}</div>`;
  }
}

// ===== Views =====
// 每个视图有完全不同的版块构成：
//  - daily:   24h 五版块 + 热点（卡片墙）
//  - weekly:  本周每日官方导语时间线 + 本周 7d 精选

const VIEWS = {

    totalLabel: '条精选资讯',
    sections: [
      { id: 'hot', label: '近期热点', hot: true },

      { id: 'papers', label: '论文研究', cat: 'paper', fallback: true },
      { id: 'tips', label: '技巧与观点', cat: 'tip' },
    ],
  },
  weekly: {
    label: 'AI 周报',
    badge: 'AIHOT 本周脉络 · 官方每日导语',
    totalLabel: '条本周精选',
    sections: [
      { id: 'w-thread', label: '本周脉络', thread: true },

const WEEKLY_PICKS_CAP = 24; // 周报精选最多展示条数

async function fetchCategory(cat, fallbackMode) {
  let url = `${API_BASE}/items?mode=selected&window=24h&category=${cat}&limit=10`;
  let data = await fetchJSON(url);
  let items = data.items || [];
  if (items.length === 0 && fallbackMode) {
    url = `${API_BASE}/items?mode=all&window=7d&category=${cat}&limit=5`;
    data = await fetchJSON(url);
    items = data.items || [];
  }
  return { items };
}

// 日报归档 -> 官方每日导语时间线
function parseThread(d) {
  const items = (d && d.items) || [];
  return items
    .map(x => ({
      date: x.date,
      title: x.leadTitle || '',
      url: (x.links && x.links.aihot) || `https://aihot.news/daily/${x.date}`,
    }))
    .filter(x => x.date && x.title);
}

// 按 ISO 周分组（threadData 本身按日期倒序），返回最新周在前
function groupThreadByWeek(rows) {
  const groups = {};
  for (const r of rows) {
    const iw = isoWeekOf(r.date);
    const k = `${iw.year}-W${String(iw.week).padStart(2, '0')}`;
    (groups[k] = groups[k] || []).push(r);
  }
  return Object.keys(groups).sort().reverse().map(k => ({
    key: k,
    week: k.split('-W')[1],
    days: groups[k],
  }));
}

// Global state
let allItems = [];    // 当前视图的卡片条目
let threadData = [];  // 当前视图的时间线条目
let viewData = { daily: null, weekly: null, monthly: null }; // 视图数据缓存

function cardHTML(entry) {
  const item = entry.item;
  const time = fmtTime(getTime(item));
  const source = item.source ? item.source.name : '未知来源';
  const summary = truncate(item.summary || '', 110);
  const fav = isFav(entry.key);
  const rd = isRead(entry.key);
  const hotLine = entry.rank ? `<div class="card-hotline">${ICONS.flame} #${entry.rank} · ${entry.sourceCount || 0} 个信源在聊</div>` : '';
  const titleAttr = String(item.title).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  return `<div class="card ${rd ? 'read' : ''} ${fav ? 'fav' : ''}" data-num="${entry.num}" role="button" tabindex="0" aria-label="${titleAttr}">
    <div class="card-num">${entry.num}</div>
    <button class="card-fav ${fav ? 'on' : ''}" aria-label="收藏">${fav ? ICONS.starFilled : ICONS.star}</button>
    <div class="card-title">${item.title}</div>
    ${hotLine}
    <div class="card-meta">
      <span class="card-chip">${source}</span>
      <span class="card-time">${time}</span>
    </div>
    <p class="card-summary">${summary || '暂无摘要'}</p>
    <span class="card-tap-hint">点击查看详情 →</span>
  </div>`;
}

function threadItemHTML(r) {
  return `<a class="timeline-item" href="${r.url}" data-date="${r.date}" target="_blank" rel="noopener noreferrer">
    <div class="timeline-date">${dateLabel(r.date)}</div>
    <div class="timeline-title">${r.title}</div>
    <span class="timeline-hint">展开当日日报概览 →</span>
  </a>`;
}

function matchSearch(item) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  const hay = (item.title + ' ' + (item.summary || '') + ' ' + (item.source ? item.source.name : '')).toLowerCase();
  return hay.includes(q);
}

function visibleEntries() {
  return allItems.filter(e => {
    if (filter === 'favorites' && !isFav(e.key)) return false;
    if (filter === 'unread' && isRead(e.key)) return false;
    if (!matchSearch(e.item)) return false;
    return true;
  });
}

// 时间线只在「全部 + 有搜索词」时参与过滤；收藏/未读筛选下隐藏
function visibleThread() {
  if (filter !== 'all') return [];
  if (!searchQuery) return threadData;
  const q = searchQuery.toLowerCase();
  return threadData.filter(r => (r.title + ' ' + r.date).toLowerCase().includes(q));
}

// ===== Render (纯本地重绘，不重新拉数据) =====
function render() {
  const viewDef = VIEWS[view];
  const entries = visibleEntries();
  const bySection = {};
  for (const e of entries) (bySection[e.sectionId] = bySection[e.sectionId] || []).push(e);

  const isFiltered = (filter !== 'all') || !!searchQuery;
  let navHTML = '', statsHTML = '', mainHTML = '', shown = 0;

  for (const sec of viewDef.sections) {
    if (sec.highlights) {
      // 月报「本期看点」：官方月报同款结构（统计条 + 编号看点），按周提炼
      const rows = visibleThread();
      if (rows.length === 0 && isFiltered) continue;
      const weeks = groupThreadByWeek(rows);
      shown += weeks.length;
      navHTML += `<a href="#section-${sec.id}">${sec.label} (${weeks.length})</a>`;
      statsHTML += `<div class="stat-item"><div class="stat-num">${weeks.length}</div><div class="stat-label">${sec.label}</div></div>`;

      const bodyHTML = weeks.length === 0
        ? `<div class="empty-section">暂无数据</div>`
        : `<div class="m-stats">
            <div class="m-stat"><div class="m-stat-num">${rows.length}</div><div class="m-stat-label">天官方脉络</div></div>
            <div class="m-stat"><div class="m-stat-num">${weeks.length}</div><div class="m-stat-label">周看点</div></div>
            <div class="m-stat"><div class="m-stat-num">${rows.length}</div><div class="m-stat-label">期日报汇聚</div></div>
          </div>
          <div class="hl-list">${weeks.map((w, i) => `
            <button class="hl-item" type="button" data-week="${w.key}">
              <div class="hl-num">${String(i + 1).padStart(2, '0')}</div>
              <div class="hl-body">
                <div class="hl-week">第 ${w.week} 周 · ${w.days[w.days.length - 1].date} ~ ${w.days[0].date}</div>
                <div class="hl-title">${w.days[0].title}</div>
                <div class="hl-meta">${w.days.length} 天脉络 · 点击定位该周详情 →</div>
              </div>
            </button>`).join('')}</div>`;

      mainHTML += `<section class="section" id="section-${sec.id}">
        <div class="section-header"><h2>${sec.label}</h2><span class="section-count">${weeks.length} 周</span><span class="section-note">按周提炼头条 · 点击定位该周脉络</span></div>
        ${bodyHTML}
      </section>`;
    } else if (sec.thread) {
      const rows = visibleThread();
      if (rows.length === 0 && isFiltered) continue;
      shown += rows.length;
      navHTML += `<a href="#section-${sec.id}">${sec.label} (${rows.length})</a>`;
      statsHTML += `<div class="stat-item"><div class="stat-num">${rows.length}</div><div class="stat-label">${sec.label}</div></div>`;

      let bodyHTML = '';
      if (rows.length === 0) {
        bodyHTML = `<div class="empty-section">暂无数据</div>`;
      } else if (sec.groupByWeek) {
        bodyHTML = '<div class="timeline">' + groupThreadByWeek(rows).map(w => {
          const first = w.days[w.days.length - 1], last = w.days[0];
          return `<div class="timeline-group-title" id="week-${w.key}">第 ${w.week} 周 · ${first.date} ~ ${last.date} · ${w.days.length} 天</div>` +
            w.days.map(threadItemHTML).join('');
        }).join('') + '</div>';
      } else {
        bodyHTML = `<div class="timeline">${rows.map(threadItemHTML).join('')}</div>`;
      }

      const officialLink = view === 'weekly'
        ? `<a href="https://aihot.news/weekly" target="_blank" rel="noopener noreferrer">AIHOT 官方周报 ↗</a>`
        : `<a href="https://aihot.news/monthly" target="_blank" rel="noopener noreferrer">AIHOT 官方月报 ↗</a>`;
      mainHTML += `<section class="section" id="section-${sec.id}">
        <div class="section-header"><h2>${sec.label}</h2><span class="section-count">${rows.length} 天</span><span class="section-note">AIHOT 官方每日头条 · ${officialLink}</span></div>
        ${bodyHTML}
      </section>`;
    } else {
      const cards = bySection[sec.id] || [];
      if (cards.length === 0 && isFiltered) continue;
      shown += cards.length;
      navHTML += `<a href="#section-${sec.id}">${sec.label} (${cards.length})</a>`;
      statsHTML += `<div class="stat-item"><div class="stat-num">${cards.length}</div><div class="stat-label">${sec.label}</div></div>`;
      const noteHTML = sec.picks ? `<span class="section-note">过去 7 天精选 · 最多 ${WEEKLY_PICKS_CAP} 条</span>` : '';
      mainHTML += `<section class="section" id="section-${sec.id}">
        <div class="section-header"><h2>${sec.label}</h2><span class="section-count">${cards.length} 条</span>${noteHTML}</div>`;
      if (cards.length === 0) mainHTML += `<div class="empty-section">暂无数据</div>`;
      else mainHTML += `<div class="cards">${cards.map(cardHTML).join('')}</div>`;
      mainHTML += `</section>`;
    }
  }

  if (shown === 0) {
    mainHTML = `<div class="empty-section">${ICONS.inbox}<div>没有匹配的资讯</div></div>`;
  }

  document.getElementById('main-content').innerHTML = mainHTML;
  document.getElementById('nav-inner').innerHTML = navHTML;
  document.getElementById('hero-stats').innerHTML = statsHTML;
  document.getElementById('toolbar-count').textContent =
    `显示 ${shown} 条` + (filter !== 'all' ? ` · 筛选：${filter === 'favorites' ? '收藏' : '未读'}` : '') +
    (searchQuery ? ` · 搜索：${searchQuery}` : '');

  bindCards();
  initScrollSpy();
}

function bindCards() {
  document.querySelectorAll('.card').forEach(el => {
    const openCard = () => {
      const num = parseInt(el.dataset.num, 10);
      const entry = allItems.find(x => x.num === num);
      if (entry) openModal(entry);
    };
    el.addEventListener('click', openCard);
    // role="button" 不会自带激活行为，需自行实现 Enter / Space
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        openCard();
      }
    });
  });
  document.querySelectorAll('.card-fav').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const num = parseInt(btn.closest('.card').dataset.num, 10);
      const entry = allItems.find(x => x.num === num);
      if (entry) { toggleFav(entry.key); render(); }
    });
  });
  // 时间线条目：点击展开当日日报概览（阻止直接跳走）
  document.querySelectorAll('.timeline-item').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const row = threadData.find(x => x.date === el.dataset.date);
      if (row) openThreadModal(row);
    });
  });
  // 月报看点：点击平滑定位到该周的脉络分组
  document.querySelectorAll('.hl-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = document.getElementById('week-' + btn.dataset.week);
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ===== Modal =====
// 弹窗焦点管理：记住触发元素 → 聚焦关闭按钮 → 关闭时还原
// 注意：openModal 里会 render() 重建卡片，原元素会被销毁，
// 所以同时记住序号，关闭时按选择器重新定位到重建后的卡片。
let modalReturnFocus = null;
let modalReturnSelector = null;

function showModalShell() {
  const el = document.activeElement;
  modalReturnFocus = el;
  modalReturnSelector = (el && el.dataset && el.dataset.num)
    ? `.card[data-num="${el.dataset.num}"]`
    : null;
  document.getElementById('modal-backdrop').classList.add('show');
  document.body.classList.add('modal-open');
  const closeBtn = document.getElementById('modal-close');
  if (closeBtn) closeBtn.focus();
}

function openModal(entry) {
  const item = entry.item;
  const time = fmtTime(getTime(item));
  const source = item.source ? item.source.name : '未知来源';
  const summary = item.summary || '';
  const links = item.links || {};
  const aihotUrl = links.aihot || '';
  const originalUrl = links.original || '';
  const storyMatch = (links.story || '').match(/story\/([a-f0-9-]+)/i);
  const storyPublicId = storyMatch ? storyMatch[1] : null;

  document.getElementById('modal-num').textContent = `序号 ${entry.num}`;
  document.getElementById('modal-title').textContent = item.title;
  document.getElementById('modal-source').textContent = source;
  document.getElementById('modal-time').textContent = time;
  document.getElementById('modal-source-detail').textContent = `来源：${source}`;

  const s = document.getElementById('modal-summary');
  if (summary) {
    s.className = 'modal-summary';
    s.textContent = summary;
  } else if (storyPublicId) {
    s.className = 'modal-summary-loading';
    s.innerHTML = `${ICONS.spinner}<span>正在加载 AIHOT 事件综述...</span>`;
    fetchJSON(`${API_BASE}/stories/${storyPublicId}`).then(d => {
      const story = (d && d.story) || {};
      const latest = story.latest || '';
      const digest = story.digest || '';
      if (!latest && !digest) {
        s.className = 'modal-summary-empty';
        s.textContent = '暂无摘要，请通过下方链接查看原文。';
        return;
      }
      s.className = 'modal-summary';
      s.innerHTML = '';
      if (latest) {
        const latestEl = document.createElement('span');
        latestEl.className = 'modal-context-latest';
        latestEl.innerHTML = `${ICONS.bookmark} 最新：` + latest;
        s.appendChild(latestEl);
      }
      if (digest) {
        const digestEl = document.createElement('span');
        digestEl.textContent = digest;
        s.appendChild(digestEl);
      }
    }).catch(() => {
      s.className = 'modal-summary-empty';
      s.textContent = 'AIHOT 综述加载失败，请通过下方链接查看原文。';
    });
  } else {
    s.className = 'modal-summary-empty';
    s.textContent = '暂无摘要，请通过下方链接查看原文。';
  }

  const cta = document.getElementById('modal-cta');
  const ctaAihot = document.getElementById('modal-cta-aihot');
  ctaAihot.style.display = ''; // 从日报概览弹窗切回时恢复
  if (aihotUrl) { ctaAihot.href = aihotUrl; ctaAihot.classList.remove('disabled'); }
  else { ctaAihot.removeAttribute('href'); ctaAihot.classList.add('disabled'); }

  if (originalUrl) { cta.href = originalUrl; cta.classList.remove('disabled'); cta.textContent = '查看原文 →'; }
  else { cta.removeAttribute('href'); cta.classList.add('disabled'); cta.textContent = '暂无原文'; }

  showModalShell();

  if (!isRead(entry.key)) { markRead(entry.key); render(); }
}

// 周报 / 月报时间线：展开某一天的日报概览
function openThreadModal(row) {
  document.getElementById('modal-num').textContent = `日报 ${row.date}`;
  document.getElementById('modal-title').textContent = row.title;
  document.getElementById('modal-source').textContent = 'AIHOT 日报';
  document.getElementById('modal-time').textContent = dateLabel(row.date);
  document.getElementById('modal-source-detail').textContent = `AIHOT 日报 · ${row.date}`;

  const s = document.getElementById('modal-summary');
  s.className = 'modal-summary-loading';
  s.innerHTML = `${ICONS.spinner}<span>正在加载该日日报内容...</span>`;

  const cta = document.getElementById('modal-cta');
  const ctaAihot = document.getElementById('modal-cta-aihot');
  ctaAihot.style.display = 'none'; // 概览弹窗只需一个按钮
  cta.href = row.url;
  cta.classList.remove('disabled');
  cta.textContent = '打开完整日报 →';

  showModalShell();

  fetchJSON(`${API_BASE}/dailies/${row.date}`).then(d => {
    const r = (d && d.report) || {};
    const secs = (r.sections || []).filter(x => (x.items || []).length > 0);
    let total = 0;
    for (const x of secs) total += x.items.length;
    if (total === 0) {
      s.className = 'modal-summary-empty';
      s.textContent = '该日日报暂无条目内容，可点击下方按钮打开完整日报。';
      return;
    }
    s.className = 'daily-digest';
    s.innerHTML = secs.map(sec => {
      const itemsHTML = sec.items.map(it => {
        const src = (it.source && it.source.name) || '';
        const sum = it.summary || '';
        const link = (it.links && (it.links.aihot || it.links.original)) || '';
        return `<div class="digest-item">
          <div class="digest-item-title">${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">${it.title}</a>` : it.title}</div>
          ${sum ? `<div class="digest-item-summary">${sum}</div>` : ''}
          ${src ? `<div class="digest-item-source">${src}</div>` : ''}
        </div>`;
      }).join('');
      return `<div class="digest-section">
        <div class="digest-section-title">${sec.label} · ${sec.items.length} 条</div>
        ${itemsHTML}
      </div>`;
    }).join('');
  }).catch(() => {
    s.className = 'modal-summary-empty';
    s.textContent = '加载失败，可点击下方按钮打开完整日报。';
  });
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('show');
  document.body.classList.remove('modal-open');
  // 优先定位重建后的同一张卡片；找不到再退回原元素
  let target = null;
  if (modalReturnSelector) {
    try { target = document.querySelector(modalReturnSelector); } catch (e) { target = null; }
  }
  if (!target) target = modalReturnFocus;
  if (target && typeof target.focus === 'function') target.focus();
  modalReturnFocus = null;
  modalReturnSelector = null;
}

// ===== Data load =====
async function fetchViewData(name) {
  if (name === 'daily') {
    const cats = VIEWS.daily.sections.filter(s => !s.hot);
    const [daily, hot, ...catResults] = await Promise.all([
      trackFetch(fetchJSON(`${API_BASE}/dailies/latest`)),
      trackFetch(fetchJSON(`${API_BASE}/hot-topics`)),
      ...cats.map(s => trackFetch(fetchCategory(s.cat, s.fallback)).then(r => r || { items: [] })),
    ]);
    return { daily, hot, cats, catResults };
  }
  if (name === 'weekly') {
    const [thread, picks] = await Promise.all([
      trackFetch(fetchJSON(`${API_BASE}/dailies?limit=7`)),
      trackFetch(fetchJSON(`${API_BASE}/items?mode=selected&window=7d&limit=50`)),
    ]);
    return { thread: parseThread(thread), picks: (picks && picks.items) || [] };
  }
  // monthly
  const thread = await trackFetch(fetchJSON(`${API_BASE}/dailies?limit=30`));
  return { thread: parseThread(thread) };
}

function applyView(name) {
  view = name;
  LS.set(LS_VIEW, view);
  const d = viewData[name];
  const viewDef = VIEWS[name];

  allItems = [];
  threadData = d.thread || [];
  let globalNum = 0;

  if (name === 'daily') {
    if (d.hot && d.hot.items && d.hot.items.length) {
      for (const item of d.hot.items.slice(0, 5)) {
        globalNum++;
        allItems.push({
          item, num: globalNum, key: itemKey(item), sectionId: 'hot',
          rank: item.rank, sourceCount: item.sourceCount, signalCount: item.signalCount,
        });
      }
    }
    const cats = d.cats;
    for (let i = 0; i < cats.length; i++) {
      for (const item of (d.catResults[i].items || [])) {
        globalNum++;
        allItems.push({ item, num: globalNum, key: itemKey(item), sectionId: cats[i].id });
      }
    }
  } else if (name === 'weekly') {
    for (const item of (d.picks || [])) {
      if (globalNum >= WEEKLY_PICKS_CAP) break;
      globalNum++;
      allItems.push({ item, num: globalNum, key: itemKey(item), sectionId: 'w-picks' });
    }
  }
  // monthly 只有时间线，无卡片条目

  // ---- Hero ----
  document.getElementById('hero-title').textContent = viewDef.label;
  document.getElementById('hero-badge').textContent = viewDef.badge;
  document.getElementById('hero-total-label').textContent = viewDef.totalLabel;
  document.title = viewDef.label;

  let dateLine = '';
  if (name === 'daily') {
    const r = (d.daily && d.daily.report) || null;
    if (r && r.windowStart && r.windowEnd) {
      const bj = (utc) => { const t = new Date(utc.getTime() + 8*3600000); return `${t.getUTCFullYear()}年${t.getUTCMonth()+1}月${t.getUTCDate()}日 ${String(t.getUTCHours()).padStart(2,'0')}:00`; };
      dateLine = `${bj(new Date(r.windowStart))} — ${bj(new Date(r.windowEnd))}（北京时间）`;
    } else {
      const bj = new Date(Date.now() + 8*3600000);
      dateLine = `${bj.getUTCFullYear()}年${bj.getUTCMonth()+1}月${bj.getUTCDate()}日（北京时间）`;
    }
  } else {
    const t = threadData;
    if (t.length) {
      const first = t[t.length - 1], last = t[0];
      dateLine = `${first.date} 至 ${last.date} · 共 ${t.length} 天`;
    } else {
      dateLine = '暂无归档数据';
    }
  }

  document.getElementById('hero-date').textContent = dateLine || '数据加载中...';
  document.getElementById('hero-date').classList.remove('loading-text');
  document.getElementById('hero-total').textContent =
    name === 'monthly' ? threadData.length : (name === 'weekly' ? allItems.length : allItems.length);

  // ---- 三个视图卡片的摘要 ----
  const dd = viewData.daily;
  const dr = (dd && dd.daily && dd.daily.report) || null;
  if (dr) {
    let cnt = 0;
    for (const s of (dr.sections || [])) cnt += (s.items || []).length;
    cnt += (dr.flashes || []).length;
    document.getElementById('report-daily-meta').textContent =
      (cnt > 0 ? `${dr.date} · ${cnt} 篇` : `${dr.date}`) + ' · 五版块 + 热点';
  } else {
    document.getElementById('report-daily-meta').textContent = '五版块 + 近期热点';
  }
  const iw = isoWeekBJ();
  document.getElementById('report-weekly-meta').textContent =
    `VOL.${iw.year}-W${String(iw.week).padStart(2, '0')} · 7 天脉络 + 精选`;
  const nowBJ = new Date(Date.now() + 8 * 3600000);
  document.getElementById('report-monthly-meta').textContent =
    `${nowBJ.getUTCFullYear()}年${nowBJ.getUTCMonth()+1}月 · 30 期日报脉络`;

  // ---- 切换器高亮 ----
  document.querySelectorAll('.report-card').forEach(el => {
    el.classList.toggle('active', el.dataset.view === name);
  });

  // ---- Footer ----
  const genTime = fmtTime(new Date().toISOString());
  const dailyUrl = (viewData.daily && viewData.daily.daily && viewData.daily.daily.report &&
    viewData.daily.daily.report.links && viewData.daily.daily.report.links.aihot) || 'https://aihot.news/daily';
  document.getElementById('footer-inner').innerHTML = `
    <p>当前视图：<strong>${viewDef.label}</strong> · AI 数据：<a href="${dailyUrl}" target="_blank" rel="noopener noreferrer">AIHOT 日报</a> · <a href="https://aihot.news/weekly" target="_blank" rel="noopener noreferrer">官网周报</a> · <a href="https://aihot.news/monthly" target="_blank" rel="noopener noreferrer">官网月报</a> · 热点：<a href="https://aihot.news/hot" target="_blank" rel="noopener noreferrer">AIHOT 热点</a> · 天气：<a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
    <p style="margin-top:6px;font-size:12px">周报／月报由 AIHOT 日报归档的官方每日导语聚合而成 · 页面生成时间：${genTime}（北京时间）· 数据实时拉取，每次刷新即最新</p>
  `;

  render();
}

async function loadView(name, force) {
  if (viewData[name] && !force) { applyView(name); return; }
  document.getElementById('hero-date').textContent = '正在拉取数据...';
  document.getElementById('hero-date').classList.add('loading-text');
  document.getElementById('hero-total').textContent = '—';
  document.getElementById('main-content').innerHTML = '';
  document.getElementById('error-banner').classList.remove('show');
  resetSourceHealth();
  try {
    viewData[name] = await fetchViewData(name);
    applyView(name);
    checkSourceHealth();
  } catch (err) {
    handleError(err);
  }
}

// ===== Scroll spy =====
function initScrollSpy() {
  const nav = document.getElementById('nav');
  const links = nav.querySelectorAll('a');
  const sections = [];
  links.forEach(a => {
    const id = a.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) sections.push({ link: a, el });
  });
  let ticking = false;
  function updateActive() {
    ticking = false;
    if (sections.length === 0) return;
    let current = sections[0];
    const scrollY = window.scrollY + nav.offsetHeight + 20;
    for (const s of sections) { if (s.el.offsetTop <= scrollY) current = s; }
    links.forEach(a => a.classList.remove('active'));
    if (current) current.link.classList.add('active');
  }
  // 每帧最多执行一次，避免滚动事件高频触发样式写入
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(updateActive);
  }
  window.removeEventListener('scroll', onScroll);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

  const btn = e.target.closest('.filter-chip');

    LS.set(LS_READ, [...read]);
    render();
    return;

  filter = btn.dataset.filter;

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-backdrop')) closeModal();
});
document.addEventListener('keydown', (e) => {
  const backdrop = document.getElementById('modal-backdrop');
  const isOpen = backdrop && backdrop.classList.contains('show');
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key !== 'Tab' || !isOpen) return;
  // 弹窗打开时把 Tab 焦点约束在对话框内
  const focusables = backdrop.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

function handleError(err) {
  const banner = document.getElementById('error-banner');
  banner.textContent = '数据加载失败：' + (err.message || '未知错误') + '。请检查网络后刷新页面重试。';
  banner.classList.add('show');
  document.getElementById('hero-date').textContent = '数据加载失败';
  document.getElementById('hero-date').classList.remove('loading-text');
}

// 从未手动选择过主题时，跟随系统偏好的实时变化。
// 注意：MediaQueryList 的 addEventListener 在 Safari < 14 不存在（只有 addListener），
// 且整个页面脚本是一个 IIFE —— 这里若抛错会连带数据加载一起挂掉，所以必须容错。
function onSystemThemeChange(e) {
  if (localStorage.getItem(LS_THEME)) return; // 已手动选择，不覆盖用户意图
  theme = e.matches ? 'dark' : 'light';
  applyTheme();
  syncIcon();
}
try {
  if (typeof prefersDark.addEventListener === 'function') {
    prefersDark.addEventListener('change', onSystemThemeChange);
  } else if (typeof prefersDark.addListener === 'function') {
    prefersDark.addListener(onSystemThemeChange);
  }
} catch (e) {}

// 点击城市下拉以外的地方收起列表（只注册一次，避免重渲染时累积监听）
document.addEventListener('click', (e) => {
  const picker = document.querySelector('.city-picker');
  if (picker && picker.contains(e.target)) return;
  const menu = document.getElementById('city-menu');
  if (menu && !menu.hidden) {
    menu.hidden = true;
    const trg = document.getElementById('city-trigger');
    if (trg) trg.setAttribute('aria-expanded', 'false');
  }
});

const ttBtn0 = document.getElementById('theme-toggle');
if (ttBtn0) ttBtn0.classList.add('tt-ready');
loadWeather();
