<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报</title>
<style>
  :root {
    --bg: #f8f9fb;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #5a5f72;
    --text-muted: #8e92a5;
    --border: #e8eaf0;
    --accent: #6366f1;
    --accent-light: #eef0ff;
    --hero-bg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .hero {
    background: var(--hero-bg);
    color: #fff;
    padding: 48px 24px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    top: -120px; right: -100px;
  }
  .hero::after {
    content: '';
    position: absolute;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    bottom: -80px; left: -60px;
  }
  .hero-content { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }
  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 4px 16px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }
  .hero h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
  .hero .date-range { font-size: 14px; opacity: 0.8; margin-bottom: 24px; }
  .hero .total { font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .hero .total-label { font-size: 14px; opacity: 0.75; margin-top: 4px; }
  .loading-text { font-size: 18px; opacity: 0.9; margin-top: 16px; }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: 24px;
  }
  .stat-item {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    min-width: 90px;
    text-align: center;
  }
  .stat-item .stat-num { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .stat-item .stat-label { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    overflow-x: auto;
  }
  .nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
  }
  .nav a {
    display: block;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .nav a:hover { color: var(--accent); }
  .nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

  .main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }

  .section { margin-bottom: 48px; }
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent-light);
  }
  .section-header h2 { font-size: 20px; font-weight: 700; }
  .section-header .section-count { font-size: 13px; color: var(--text-muted); font-weight: 500; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: box-shadow 0.2s, transform 0.2s;
    position: relative;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card-num {
    position: absolute;
    top: -10px; left: -10px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(99,102,241,0.35);
  }
  .card-title {
    font-size: 15px; font-weight: 600; line-height: 1.5;
    margin-bottom: 8px; margin-top: 4px;
  }
  .card-title a { color: inherit; text-decoration: none; }
  .card-title a:hover { color: var(--accent); }
  .card-meta {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .card-chip {
    display: inline-block;
    background: #f1f3f8; color: #4a4e6b;
    font-size: 12px; font-weight: 500;
    padding: 2px 10px; border-radius: 99px;
  }
  .card-time { font-size: 12px; color: var(--text-muted); }
  .card-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.65; }
  .card-link {
    display: inline-block; margin-top: 10px;
    font-size: 12px; font-weight: 500;
    color: var(--accent); text-decoration: none;
  }
  .card-link:hover { text-decoration: underline; }

  .footer {
    max-width: 1100px; margin: 0 auto;
    padding: 0 20px 40px; text-align: center;
  }
  .footer-inner {
    border-top: 1px solid var(--border);
    padding-top: 24px;
    color: var(--text-muted); font-size: 13px; line-height: 1.8;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  .error-banner {
    max-width: 1100px; margin: 16px 20px;
    background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
    padding: 12px 16px; font-size: 13px; color: #856404;
    display: none;
  }
  .error-banner.show { display: block; }

  @media (max-width: 768px) {
    .hero { padding: 36px 16px 32px; }
    .hero h1 { font-size: 24px; }
    .hero .total { font-size: 42px; }
    .stats-bar { gap: 10px; }
    .stat-item { padding: 10px 14px; min-width: 70px; }
    .stat-item .stat-num { font-size: 20px; }
    .cards { grid-template-columns: 1fr; }
    .main { padding: 24px 12px 36px; }
    .nav a { padding: 10px 14px; font-size: 13px; }
  }
  @media (max-width: 480px) {
    .hero { padding: 28px 12px 24px; }
    .hero h1 { font-size: 22px; }
    .hero .total { font-size: 36px; }
    .stats-bar { gap: 6px; }
    .stat-item { padding: 8px 10px; min-width: 60px; }
    .card { padding: 16px; }
    .card-num { width: 24px; height: 24px; font-size: 11px; top: -8px; left: -8px; }
  }

  html { scroll-behavior: smooth; scroll-padding-top: 56px; }
</style>
</head>
<body>

<!-- Hero (dynamic) -->
<div class="hero">
  <div class="hero-content" id="hero-content">
    <div class="hero-badge">AIHOT 每日精选</div>
    <h1>AI 日报</h1>
    <div class="date-range loading-text" id="hero-date">正在拉取数据...</div>
    <div class="total" id="hero-total">—</div>
    <div class="total-label">条精选资讯</div>
    <div class="stats-bar" id="hero-stats"></div>
  </div>
</div>

<!-- Error banner -->
<div class="error-banner" id="error-banner"></div>

<!-- Nav (dynamic) -->
<nav class="nav" id="nav">
  <div class="nav-inner" id="nav-inner"></div>
</nav>

<!-- Main content (dynamic) -->
<main class="main" id="main-content"></main>

<!-- Footer -->
<footer class="footer">
  <div class="footer-inner" id="footer-inner"></div>
</footer>

<script>
(function() {

const API_BASE = 'https://aihot.virxact.com/api/v1';
const UA = 'ai-daily-dashboard/1.0 (+https://aihot.virxact.com/aihot-skill/)';

const SECTIONS = [
  { id: 'models', label: '模型发布/更新', cat: 'ai-models' },
  { id: 'products', label: '产品发布/更新', cat: 'ai-products' },
  { id: 'industry', label: '行业动态', cat: 'industry' },
  { id: 'papers', label: '论文研究', cat: 'paper', fallback: true },
  { id: 'tips', label: '技巧与观点', cat: 'tip' },
];

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8 * 3600000);
  const y = bj.getUTCFullYear();
  const m = bj.getUTCMonth() + 1;
  const day = bj.getUTCDate();
  const h = String(bj.getUTCHours()).padStart(2,'0');
  const min = String(bj.getUTCMinutes()).padStart(2,'0');
  return `${y}年${m}月${day}日 ${h}:${min}`;
}

function getTime(entry) {
  return entry.publishedAt || entry.discoveredAt;
}

function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.slice(0, max).replace(/\s+$/,'') + '...' : str;
}

function cardHTML(item, num) {
  const time = fmtTime(getTime(item));
  const source = item.source ? item.source.name : '未知来源';
  const summary = truncate(item.summary || '', 80);
  return `<div class="card">
    <div class="card-num">${num}</div>
    <div class="card-title">
      <a href="${item.links.aihot || item.links.original || '#'}" target="_blank" rel="noopener noreferrer">${item.title}</a>
    </div>
    <div class="card-meta">
      <span class="card-chip">${source}</span>
      <span class="card-time">${time}</span>
    </div>
    <p class="card-summary">${summary || '暂无摘要'}</p>
    <a class="card-link" href="${item.links.original || item.links.aihot || '#'}" target="_blank" rel="noopener noreferrer">查看原文 →</a>
  </div>`;
}

async function fetchJSON(url) {
  const resp = await fetch(url, { headers: { 'User-Agent': UA } });
  if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
  return resp.json();
}

// Fetch category items, with optional fallback for empty results
async function fetchCategory(cat, fallbackMode) {
  let url = `${API_BASE}/items?mode=selected&window=24h&category=${cat}&limit=10`;
  let data = await fetchJSON(url);
  let items = data.items || [];
  let note = '';

  // Fallback: if selected is empty and fallback enabled, try mode=all+7d
  if (items.length === 0 && fallbackMode) {
    url = `${API_BASE}/items?mode=all&window=7d&category=${cat}&limit=5`;
    data = await fetchJSON(url);
    items = data.items || [];
    if (items.length > 0) note = '（非精选，7天窗口补充）';
  }

  return { items, note };
}

function buildPage() {
  document.getElementById('hero-date').textContent = '正在拉取数据...';
  document.getElementById('hero-total').textContent = '—';
  document.getElementById('hero-stats').innerHTML = '';
  document.getElementById('nav-inner').innerHTML = '';
  document.getElementById('main-content').innerHTML = '';
  document.getElementById('footer-inner').innerHTML = '';
  document.getElementById('error-banner').classList.remove('show');
}

async function load() {
  buildPage();

  // Fetch daily info and all categories in parallel
  const dailyPromise = fetchJSON(`${API_BASE}/dailies/latest`).catch(() => null);
  const catPromises = SECTIONS.map(s => fetchCategory(s.cat, s.fallback).catch(() => ({ items: [], note: '加载失败' })));

  const [daily, ...catResults] = await Promise.all([dailyPromise, ...catPromises]);

  // Determine date
  let dateStr = '';
  let windowStr = '';
  let dailyUrl = 'https://aihot.virxact.com/daily';
  if (daily && daily.report && daily.report.date) {
    const d = daily.report.date;
    dateStr = d;
    dailyUrl = daily.report.links?.aihot || dailyUrl + '/' + d;
    const ws = daily.report.windowStart ? new Date(daily.report.windowStart) : null;
    const we = daily.report.windowEnd ? new Date(daily.report.windowEnd) : null;
    if (ws && we) {
      const bj = (utc) => { const t = new Date(utc.getTime() + 8*3600000); return `${t.getUTCFullYear()}年${t.getUTCMonth()+1}月${t.getUTCDate()}日 ${String(t.getUTCHours()).padStart(2,'0')}:00`; };
      windowStr = `${bj(ws)} — ${bj(we)}（北京时间）`;
    }
  } else {
    const now = new Date();
    const bj = new Date(now.getTime() + 8*3600000);
    dateStr = `${bj.getUTCFullYear()}-${String(bj.getUTCMonth()+1).padStart(2,'0')}-${String(bj.getUTCDate()).padStart(2,'0')}`;
    windowStr = `${bj.getUTCFullYear()}年${bj.getUTCMonth()+1}月${bj.getUTCDate()}日（北京时间）`;
    dailyUrl = `https://aihot.virxact.com/daily/${dateStr}`;
  }

  // Collect all items with section info, global numbering
  let globalNum = 0;
  const sectionData = [];
  const errors = [];

  for (let i = 0; i < SECTIONS.length; i++) {
    const sec = SECTIONS[i];
    const result = catResults[i];
    const items = result.items || [];
    const note = result.note || '';

    const cards = items.map(item => {
      globalNum++;
      return { html: cardHTML(item, globalNum), item };
    });

    sectionData.push({
      id: sec.id,
      label: sec.label,
      note,
      cards,
      count: items.length,
    });
  }

  // Compute title date
  const titleDate = dateStr;
  document.title = `AI 日报 — ${titleDate}`;

  // === Render Hero ===
  document.getElementById('hero-date').textContent = windowStr || '数据加载中...';
  document.getElementById('hero-date').classList.remove('loading-text');
  document.getElementById('hero-total').textContent = globalNum;

  let statsHTML = '';
  for (const sd of sectionData) {
    statsHTML += `<div class="stat-item"><div class="stat-num">${sd.count}</div><div class="stat-label">${sd.label}</div></div>`;
  }
  document.getElementById('hero-stats').innerHTML = statsHTML;

  // === Render Nav ===
  let navHTML = '';
  for (const sd of sectionData) {
    navHTML += `<a href="#section-${sd.id}">${sd.label}</a>`;
  }
  document.getElementById('nav-inner').innerHTML = navHTML;

  // === Render Main ===
  let mainHTML = '';
  for (const sd of sectionData) {
    let labelExtra = sd.note ? ` <span style="font-size:12px;color:#c98b2e;">${sd.note}</span>` : '';
    mainHTML += `<section class="section" id="section-${sd.id}">
      <div class="section-header">
        <h2>${sd.label}</h2>
        <span class="section-count">${sd.count} 条${labelExtra}</span>
      </div>`;
    if (sd.cards.length === 0) {
      mainHTML += `<div class="empty-section">暂无数据</div>`;
    } else {
      mainHTML += `<div class="cards">${sd.cards.map(c => c.html).join('')}</div>`;
    }
    mainHTML += `</section>`;
  }
  document.getElementById('main-content').innerHTML = mainHTML;

  // === Render Footer ===
  const genTime = fmtTime(new Date().toISOString());
  document.getElementById('footer-inner').innerHTML = `
    <p>共 <strong>${globalNum}</strong> 条精选资讯 · 数据来源：<a href="${dailyUrl}" target="_blank" rel="noopener noreferrer">AIHOT 日报 (${titleDate})</a></p>
    <p style="margin-top:6px;font-size:12px">AIHOT v1 API · 页面生成时间：${genTime}（北京时间）· 数据实时拉取，每次刷新即最新</p>
  `;

  // === Scroll spy ===
  initScrollSpy();

  // === Show errors if any ===
  if (errors.length > 0) {
    const banner = document.getElementById('error-banner');
    banner.textContent = '部分数据加载失败：' + errors.join('；');
    banner.classList.add('show');
  }
}

function initScrollSpy() {
  const nav = document.getElementById('nav');
  const links = nav.querySelectorAll('a');
  const sections = [];
  links.forEach(a => {
    const id = a.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) sections.push({ link: a, el });
  });

  function onScroll() {
    let current = sections[0];
    const scrollY = window.scrollY + nav.offsetHeight + 20;
    for (const s of sections) {
      if (s.el.offsetTop <= scrollY) current = s;
    }
    links.forEach(a => a.classList.remove('active'));
    if (current) current.link.classList.add('active');
  }

  window.removeEventListener('scroll', onScroll);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

// Error handling wrapper
function handleError(err) {
  const banner = document.getElementById('error-banner');
  banner.textContent = '数据加载失败：' + (err.message || '未知错误') + '。请检查网络后刷新页面重试。';
  banner.classList.add('show');
  document.getElementById('hero-date').textContent = '数据加载失败';
  document.getElementById('hero-date').classList.remove('loading-text');
}

load().catch(handleError);

})();
</script>

</body>
</html>
